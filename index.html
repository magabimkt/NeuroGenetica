: 1, "x": "Sobreviver não basta: é preciso reproduzir e transmitir."}, {"m": "m6", "q": "A preferência por alimentos doces, vantajosa na escassez e problemática hoje, ilustra:", "o": ["Descompasso evolutivo (mismatch)", "Herança mendeliana", "Epigenética transgeracional", "Falácia naturalista"], "a": 0, "x": "Mecanismos ancestrais em ambientes modernos."}, {"m": "m7", "q": "A epigenética estuda mudanças na:", "o": ["sequência de nucleotídeos do DNA", "expressão gênica sem alteração da sequência do DNA", "quantidade de cromossomos", "estrutura das proteínas apenas"], "a": 1, "x": "As marcas regulam quando e quanto um gene é expresso."}, {"m": "m7", "q": "A cromatina mais compactada, que tende a silenciar genes, é a:", "o": ["eucromatina", "heterocromatina", "ilha CpG", "nucleotídeo"], "a": 1, "x": "A eucromatina é aberta e acessível à transcrição."}, {"m": "m7", "q": "A enzima que mantém o padrão de metilação durante a divisão celular é a:", "o": ["DNMT1", "DNMT3a", "HDAC2", "HAT"], "a": 0, "x": "DNMT3a/b fazem metilação de novo."}, {"m": "m7", "q": "A acetilação de histonas, em geral:", "o": ["compacta a cromatina e silencia genes", "afrouxa a cromatina e favorece a transcrição", "corta o mRNA", "altera a sequência do DNA"], "a": 1, "x": "HATs acetilam; HDACs retiram a acetilação."}, {"m": "m7", "q": "microRNAs atuam principalmente:", "o": ["metilando o DNA", "degradando o mRNA ou bloqueando sua tradução", "acetilando histonas", "duplicando cromossomos"], "a": 1, "x": "É uma regulação pós-transcricional."}, {"m": "m7", "q": "No estudo de Weaver et al. (2004), filhotes que receberam mais cuidado materno apresentaram:", "o": ["mais metilação do promotor do GR", "menos metilação do promotor do GR e melhor regulação do estresse", "mutações no gene do GR", "ausência de eixo HPA"], "a": 1, "x": "Mais GR no hipocampo significa freio mais eficiente do eixo do estresse."}, {"m": "m7", "q": "A adoção cruzada no estudo de Weaver mostrou que o efeito dependia:", "o": ["da linhagem genética da mãe biológica", "do cuidado recebido", "do sexo do filhote", "da dieta"], "a": 1, "x": "Filhotes de mães de baixo cuidado criados por mães de alto cuidado adquiriram o perfil de alto cuidado."}, {"m": "m7", "q": "Os receptores de glicocorticoide no hipocampo são importantes porque:", "o": ["produzem cortisol", "fazem o feedback negativo que encerra a resposta ao estresse", "sintetizam BDNF", "geram memórias episódicas"], "a": 1, "x": "Menos GR → resposta ao estresse mais prolongada."}, {"m": "m7", "q": "Em Tsankova et al. (2006), o antidepressivo imipramina:", "o": ["apagou toda a marca repressiva do BDNF", "aumentou a acetilação de histonas e restaurou a expressão do BDNF", "reduziu o BDNF", "não teve efeito"], "a": 1, "x": "A marca repressiva permaneceu, mas foi compensada."}, {"m": "m7", "q": "Segundo Guan et al. (2009), a HDAC2:", "o": ["favorece a formação de memórias", "restringe a formação de memórias e a plasticidade sináptica", "é um tipo de microRNA", "metila o DNA"], "a": 1, "x": "Sua inibição favoreceu a memória em animais."}, {"m": "m7", "q": "Sobre a transmissão epigenética entre gerações, é correto afirmar:", "o": ["está plenamente demonstrada em humanos", "foi demonstrada em animais; em humanos a evidência é preliminar e debatida", "não existe em nenhuma espécie", "só ocorre por mutações"], "a": 1, "x": "Gapp (2014) em camundongos; Yehuda (2016) em humanos, com amostra pequena."}, {"m": "m7", "q": "Klengel et al. (2013) mostraram que o aumento de risco de TEPT dependia de:", "o": ["apenas do alelo de risco do FKBP5", "apenas de trauma na vida adulta", "alelo de risco do FKBP5 combinado a trauma na infância", "dieta pobre em folato"], "a": 2, "x": "Exemplo molecular de interação gene × ambiente em janela sensível."}, {"m": "m7", "q": "O valproato tem relação com a epigenética porque:", "o": ["é um inibidor de HDAC", "é um doador de metil", "é um microRNA", "é uma DNMT"], "a": 0, "x": "Phiel et al. (2001)."}, {"m": "m7", "q": "O relógio epigenético de Horvath estima:", "o": ["o QI", "a idade biológica pela metilação do DNA", "o número de neurônios", "o nível de cortisol"], "a": 1, "x": "Aceleração epigenética = idade biológica maior que a cronológica."}, {"m": "m7", "q": "O principal desafio para interpretar marcas epigenéticas em transtornos humanos é:", "o": ["a falta de qualquer método de medida", "distinguir causa de correlação", "a ausência de DNA nos neurônios", "a impossibilidade de estudar sangue"], "a": 1, "x": "A marca pode ser causa, consequência ou efeito de medicação e hábitos."}, {"m": "m7", "q": "\"Determinismo de novo tipo\" na neuroepigenética significa:", "o": ["usar a epigenética para estigmatizar pessoas pelo histórico ambiental dos ancestrais", "negar a existência da epigenética", "acreditar que só os genes importam", "usar CRISPR em humanos"], "a": 0, "x": "Troca-se \"está nos genes\" por \"está nas marcas\"."}], "estudo": [{"secao": "📝 Questões da disciplina", "t": "Irmãos diferentes na mesma família", "q": "<p>Em uma família, dois irmãos apresentam diferenças marcantes quanto à impulsividade, apesar de terem crescido no mesmo ambiente familiar. Um deles apresenta maior reatividade emocional diante de ameaças; o outro, maior capacidade de autorregulação. Pesquisadores argumentam que diferenças genéticas podem contribuir para essa variabilidade, mas ressaltam que fatores ambientais também participam.<\/p><p><b>Assinale a alternativa que melhor interpreta a situação.<\/b><\/p>", "o": ["A existência de diferenças comportamentais entre irmãos demonstra que o comportamento é predominantemente determinado pelos genes.", "A semelhança genética entre irmãos elimina a influência de experiências individuais sobre o comportamento.", "Características comportamentais resultam de interações complexas entre fatores genéticos e ambientais, não sendo possível atribuir sua expressão exclusivamente a um único fator.", "A influência genética sobre um comportamento significa que esse comportamento necessariamente será transmitido para todos os descendentes.", "A influência ambiental sobre determinado comportamento impede a participação de mecanismos hereditários."], "a": 2, "x": "<p>Irmãos compartilham só parte dos genes e vivem o \"mesmo\" ambiente de formas diferentes. <b>A<\/b> e <b>E<\/b> escolhem um fator só. <b>B<\/b> ignora as experiências individuais. <b>D<\/b> confunde influência com transmissão obrigatória.<\/p>"}, {"t": "Gêmeos MZ não 100% concordantes", "q": "<p>Em um estudo com gêmeos monozigóticos e dizigóticos, observa-se maior concordância entre os monozigóticos para uma característica psicológica, mas a concordância não é de 100%. Um estudante conclui: <i>\"Como os MZ têm praticamente o mesmo material genético, qualquer diferença entre eles necessariamente decorre do ambiente.\"<\/i><\/p><p><b>A interpretação do estudante é:<\/b><\/p>", "o": ["correta, pois diferenças fenotípicas entre indivíduos geneticamente semelhantes são exclusivamente ambientais.", "correta, porque fatores epigenéticos não possuem relação com processos ambientais.", "inadequada, pois diferenças fenotípicas podem resultar de múltiplos mecanismos, incluindo variações ambientais, epigenéticas, desenvolvimentais e estocásticas.", "inadequada apenas porque gêmeos monozigóticos possuem genótipos completamente diferentes.", "correta, pois o ambiente é sempre mais importante que os fatores genéticos na determinação do comportamento."], "a": 2, "x": "<p>Além do ambiente, há diferenças <b>epigenéticas<\/b>, de <b>desenvolvimento<\/b> (ex.: no útero) e <b>estocásticas<\/b> (acaso biológico). <b>B<\/b> está errada porque a epigenética é justamente influenciada pelo ambiente. <b>D<\/b> está errada porque MZ têm genótipos praticamente idênticos.<\/p>"}, {"t": "Probabilidade na herança recessiva", "q": "<p>Considere o esquema (quadro de Punnett):<\/p>\n  <table class=\"punnett\"><tr><th><\/th><th>A<\/th><th>a<\/th><\/tr><tr><th>A<\/th><td>AA<\/td><td>Aa<\/td><\/tr><tr><th>a<\/th><td>Aa<\/td><td class=\"af\">aa<\/td><\/tr><\/table>\n  <p>Uma característica hipotética apresenta herança autossômica recessiva. Dois indivíduos heterozigotos têm um filho. Sendo A o alelo dominante e a o recessivo:<\/p><p><b>Qual é a probabilidade de o casal ter uma criança afetada?<\/b><\/p>", "o": ["0%", "25%", "50%", "75%", "100%"], "a": 1, "x": "<p>Só <b>aa<\/b> manifesta a condição recessiva: 1 em 4 quadros = <b>25%<\/b>. 50% seriam portadores (Aa) e 75% teriam o fenótipo dominante (AA + Aa). 💡 Pegadinha: 75% é a chance de <b>não<\/b> ser afetado.<\/p>"}, {"t": "Agregação familiar", "q": "<p>Um psicólogo participa de uma equipe que investiga a ocorrência familiar de um transtorno. Um profissional afirma: <i>\"Se uma condição apresenta agregação familiar, significa que ela é necessariamente genética.\"<\/i><\/p><p><b>A afirmação deve ser interpretada como:<\/b><\/p>", "o": ["correta, pois características familiares são necessariamente herdadas.", "correta, pois o ambiente compartilhado não interfere em características psicológicas.", "incorreta, pois a agregação familiar pode decorrer da combinação de fatores genéticos, ambientais e culturais compartilhados.", "incorreta apenas quando a condição estudada apresenta alta herdabilidade.", "correta quando familiares apresentam fenótipos semelhantes durante várias gerações."], "a": 2, "x": "<p>Famílias compartilham genes, ambiente e cultura. Agregação familiar é um ponto de partida, não uma prova. Por isso existem estudos com gêmeos e adoção. A <b>E<\/b> repete o erro, só que ao longo de gerações.<\/p>"}, {"t": "Interpretando a herdabilidade", "q": "<p>Um traço psicológico apresenta herdabilidade estimada em 0,70 em uma população específica. Um estudante afirma: <i>\"70% do comportamento de cada indivíduo é determinado geneticamente.\"<\/i><\/p><p><b>A interpretação é:<\/b><\/p>", "o": ["correta, porque a herdabilidade representa a proporção genética de um indivíduo.", "correta, desde que a população estudada apresente características ambientais semelhantes.", "incorreta, porque herdabilidade é uma propriedade estatística relacionada à variabilidade fenotípica observada em determinada população e contexto.", "incorreta, porque características psicológicas não apresentam componente genético.", "correta, porque uma herdabilidade elevada demonstra determinismo genético."], "a": 2, "x": "<p>Herdabilidade fala de <b>diferenças entre pessoas<\/b> numa população e contexto, não da composição de um indivíduo. <b>D<\/b> erra para o outro extremo. <b>E<\/b> confunde herdabilidade alta com determinismo.<\/p>"}, {"t": "Explicação evolucionista ≠ adaptativo hoje", "q": "<p>A Psicologia Evolucionista investiga relações entre mecanismos psicológicos e problemas adaptativos ancestrais. Pesquisadores alertam que uma explicação evolucionista não deve ser confundida com a afirmação de que todo comportamento atual é necessariamente adaptativo.<\/p><p><b>Essa distinção é importante porque:<\/b><\/p>", "o": ["todos os comportamentos humanos foram diretamente selecionados e permanecem adaptativos nas sociedades contemporâneas.", "mecanismos psicológicos podem ter sido moldados em ambientes ancestrais e produzir respostas diferentes quando inseridos em ambientes modernos.", "a seleção natural ocorre somente em características físicas, não podendo influenciar características comportamentais.", "comportamentos aprendidos não possuem qualquer relação com processos evolutivos.", "a evolução elimina completamente a influência cultural sobre o comportamento."], "a": 1, "x": "<p>É o <b>descompasso evolutivo<\/b> (mismatch). Exemplo: a preferência por doces era útil na escassez e é problemática hoje. <b>C<\/b>, <b>D<\/b> e <b>E<\/b> negam ou absolutizam a evolução.<\/p>"}, {"t": "Universalidade ≠ seleção natural", "q": "<p>Pesquisadores identificam uma característica psicológica presente em indivíduos de diferentes populações humanas. Um deles afirma: <i>\"Como essa característica é encontrada em várias culturas, podemos concluir que ela foi selecionada naturalmente.\"<\/i><\/p><p><b>A conclusão apresenta um problema metodológico porque:<\/b><\/p>", "o": ["características universais nunca apresentam componente biológico.", "a presença intercultural de uma característica, isoladamente, não demonstra que ela tenha sido resultado da seleção natural.", "a seleção natural ocorre somente em populações geneticamente homogêneas.", "características comportamentais não podem apresentar bases evolutivas.", "características culturais são sempre independentes da biologia."], "a": 1, "x": "<p>Uma característica pode ser universal por aprendizagem semelhante, por condições de vida comuns ou por ser subproduto de outra. É preciso mais evidência. <b>A<\/b> e <b>D<\/b> erram para o extremo oposto.<\/p>"}, {"t": "Casal de portadores", "q": "<p>Um casal procura aconselhamento após descobrir que ambos são portadores de um alelo recessivo associado a uma condição genética, e relatam familiares com a condição. O psicólogo deve compreender que dois heterozigotos podem gerar descendentes com diferentes combinações genotípicas.<\/p><p><b>A interpretação correta é:<\/b><\/p>", "o": ["todos os filhos obrigatoriamente serão afetados.", "metade dos filhos necessariamente será afetada.", "cada gestação apresenta probabilidades próprias para as diferentes combinações genéticas.", "apenas filhos do sexo masculino poderão apresentar a condição.", "o primeiro filho afetado determina geneticamente que os demais também serão afetados."], "a": 2, "x": "<p>Em cada gestação: 25% AA, 50% Aa, 25% aa, independentemente do que aconteceu antes. <b>D<\/b> descreveria herança ligada ao X, não autossômica. <b>E<\/b> é a \"falácia do apostador\".<\/p>"}, {"t": "Variante genética e impulsividade", "q": "<p>Pesquisadores identificaram associação estatística entre uma variante genética e maior frequência de comportamento impulsivo. Porém, a variante estava presente tanto em indivíduos impulsivos quanto em não impulsivos.<\/p><p><b>É correto afirmar que:<\/b><\/p>", "o": ["a variante genética determina obrigatoriamente o comportamento impulsivo.", "a presença da variante permite prever individualmente o comportamento de todas as pessoas.", "uma associação genética pode representar um fator de influência ou vulnerabilidade, sem implicar determinação absoluta do fenótipo comportamental.", "a existência de indivíduos sem o comportamento demonstra que a variante não possui qualquer relação genética.", "fatores ambientais não precisam ser considerados quando uma associação genética é encontrada."], "a": 2, "x": "<p>Associação estatística indica <b>aumento de probabilidade<\/b> numa população, não destino individual. <b>D<\/b> descarta a associação sem motivo: ela continua existindo em nível populacional.<\/p>"}, {"t": "Ambiente modificando a expressão gênica", "q": "<p>Na perspectiva contemporânea, o ambiente não é apenas um fator externo aos processos biológicos. Experiências ambientais podem modificar padrões de expressão gênica sem necessariamente alterar a sequência de DNA.<\/p><p><b>Esse fenômeno está relacionado principalmente ao conceito de:<\/b><\/p>", "o": ["mutação cromossômica obrigatória.", "epigenética.", "tradução genética.", "crossing-over somático.", "segregação independente."], "a": 1, "x": "<p>Epigenética = expressão alterada <b>sem<\/b> mudança na sequência. Mutação altera a sequência; tradução é RNA → proteína; segregação independente é a 2ª lei de Mendel.<\/p>"}, {"t": "Sobrevivência não basta", "q": "<p>Um estudante afirma: <i>\"Se determinado comportamento aumenta a sobrevivência de um indivíduo, ele necessariamente será selecionado e permanecerá presente nas próximas gerações.\"<\/i><\/p><p><b>A afirmação é inadequada porque a seleção natural depende de fatores como:<\/b><\/p>", "o": ["apenas da sobrevivência individual, independentemente da reprodução.", "exclusivamente da frequência com que um comportamento aparece em uma cultura.", "variação herdável, diferenças no sucesso reprodutivo e transmissão das características relacionadas ao comportamento.", "exclusivamente da aprendizagem social.", "somente da ocorrência de mutações prejudiciais."], "a": 2, "x": "<p>Sobreviver sem reproduzir e transmitir não altera as próximas gerações. As três condições de Darwin precisam estar presentes juntas.<\/p>"}, {"t": "Diferenças entre grupos", "q": "<p>Uma pesquisadora compara dois grupos de crianças com diferentes níveis de desempenho cognitivo. Um grupo vive com maior acesso a recursos educacionais e alimentação adequada; o outro, com maior exposição à vulnerabilidade socioeconômica.<\/p><p><b>Ao interpretar as diferenças, a pesquisadora deve evitar:<\/b><\/p>", "o": ["investigar a interação entre características individuais e ambiente.", "considerar fatores ambientais e biológicos conjuntamente.", "interpretar diferenças entre grupos como evidência direta de superioridade genética de um grupo sobre outro.", "controlar variáveis ambientais relevantes.", "analisar diferenças individuais dentro de cada grupo."], "a": 2, "x": "<p>Atenção ao <b>\"evitar\"<\/b>: as outras alternativas são boas práticas. Com ambientes tão desiguais, a diferença entre grupos não pode ser lida como genética (analogia das sementes de Lewontin).<\/p>"}, {"t": "Genótipo → fenótipo não é linear", "q": "<p>A relação entre genética e comportamento pode ser representada por:<\/p><p style=\"text-align:center\"><b>GENÓTIPO → expressão biológica → desenvolvimento → interação com o ambiente → FENÓTIPO<\/b><\/p><p><b>Essa representação não deve ser interpretada como sequência rigidamente determinada porque:<\/b><\/p>", "o": ["o genótipo não participa de nenhuma característica psicológica.", "o ambiente pode modificar trajetórias de desenvolvimento e influenciar a expressão fenotípica.", "o fenótipo é completamente independente do genótipo.", "todos os indivíduos com o mesmo genótipo apresentam necessariamente o mesmo comportamento.", "características psicológicas são exclusivamente determinadas pela cultura."], "a": 1, "x": "<p>O ambiente atua em <b>todas<\/b> as etapas, inclusive na expressão gênica (epigenética). <b>A<\/b>, <b>C<\/b> e <b>E<\/b> negam a genética; <b>D<\/b> a absolutiza.<\/p>"}, {"t": "Característica em várias gerações", "q": "<p>Em uma família, determinada característica psicológica ocorre com maior frequência em algumas gerações, mas diferentes membros apresentam manifestações distintas.<\/p><p><b>Ao analisar esse fenômeno, o psicólogo deve considerar que:<\/b><\/p>", "o": ["a presença da característica em várias gerações comprova transmissão genética simples.", "características complexas podem envolver múltiplos genes, fatores ambientais e diferentes níveis de expressão fenotípica.", "toda característica que ocorre em gerações sucessivas apresenta herança mendeliana.", "a variabilidade dentro da família exclui qualquer componente hereditário.", "a transmissão familiar elimina a influência de fatores culturais."], "a": 1, "x": "<p>Traços psicológicos são <b>complexos e poligênicos<\/b>: não seguem proporções mendelianas simples, e a expressão varia entre familiares. <b>D<\/b> erra para o outro extremo.<\/p>"}, {"t": "Integrando genética e evolução", "q": "<p>Uma equipe discute evolução, genética e comportamento. Um pesquisador propõe que certos mecanismos psicológicos podem ter sido favorecidos em contextos ancestrais, mas que sua manifestação atual depende do ambiente.<\/p><p><b>Considerando genética comportamental e Psicologia Evolucionista, a interpretação mais adequada é:<\/b><\/p>", "o": ["genes determinam diretamente comportamentos complexos, independentemente do ambiente.", "comportamentos humanos são exclusivamente produtos da cultura.", "características psicológicas podem resultar de interações entre predisposições biológicas, desenvolvimento, aprendizagem e contexto ambiental, sendo necessário evitar explicações deterministas.", "todo comportamento atual deve ser considerado uma adaptação evolutiva.", "a influência evolutiva sobre mecanismos psicológicos torna desnecessário estudar fatores sociais e culturais."], "a": 2, "x": "<p>É a síntese da disciplina: <b>interação<\/b> sem determinismo. 💡 Padrão da prova: quase sempre a correta é a que fala em <b>interação<\/b> e recusa \"exclusivamente\", \"necessariamente\" e \"sempre\".<\/p>"}, {"secao": "🧪 Epigenética na Psicologia: questões", "secaoDesc": "<p class=\"small muted\">Questões sobre o módulo 7 da Trilha. Antes de marcar, tente explicar por que cada alternativa errada está errada.<\/p>", "t": "Cuidado materno e estresse", "q": "<p>Em um estudo com ratos, filhotes que receberam mais lambidas e cuidados da mãe na primeira semana de vida apresentaram, na vida adulta, respostas ao estresse mais curtas. Quando filhotes de mães pouco cuidadosas foram criados por mães muito cuidadosas, passaram a apresentar o mesmo padrão.<\/p><p><b>A explicação mais adequada para esses resultados é:<\/b><\/p>", "o": ["O cuidado materno alterou a sequência do gene do receptor de glicocorticoide.", "O cuidado materno reduziu a metilação do promotor do gene do receptor de glicocorticoide no hipocampo, aumentando sua expressão e o feedback negativo do eixo HPA.", "O efeito foi totalmente genético, herdado da mãe biológica.", "O cuidado materno eliminou o eixo HPA.", "O resultado mostra que o ambiente não interfere na biologia."], "a": 1, "x": "<p>Este é o desenho de Weaver et al. (2004). A <b>adoção cruzada<\/b> descarta a explicação genética (C). A sequência do DNA não muda (A). O eixo HPA continua existindo, mas com freio mais eficiente (D).<\/p>"}, {"t": "Interação gene × ambiente", "q": "<p>Analise as afirmativas sobre o estudo de Klengel et al. (2013):<\/p><p>I. Portadores do alelo de risco do <i>FKBP5<\/i> expostos a trauma na infância apresentaram desmetilação de uma região do gene.<\/p><p>II. O efeito foi o mesmo para trauma ocorrido apenas na vida adulta.<\/p><p>III. O estudo exemplifica como o genótipo altera a suscetibilidade do DNA às marcas deixadas pelo ambiente.<\/p><p><b>Está correto o que se afirma em:<\/b><\/p>", "o": ["I, apenas", "I e II, apenas", "I e III, apenas", "II e III, apenas", "I, II e III"], "a": 2, "x": "<p><b>II é falsa<\/b>: o efeito dependeu do trauma na <b>infância<\/b>, uma janela sensível do desenvolvimento.<\/p>"}, {"t": "Psicoterapia e biologia (asserção-razão)", "q": "<p>I. Estudos iniciais encontraram mudanças na metilação de genes como <i>FKBP5<\/i> e <i>SLC6A4<\/i> em pessoas que responderam à psicoterapia.<\/p><p><b>PORQUE<\/b><\/p><p>II. Está comprovado que a psicoterapia altera a sequência do DNA dos pacientes.<\/p><p><b>Assinale:<\/b><\/p>", "o": ["I e II são verdadeiras, e II justifica I", "I e II são verdadeiras, mas II não justifica I", "I é verdadeira e II é falsa", "I é falsa e II é verdadeira", "I e II são falsas"], "a": 2, "x": "<p>A psicoterapia pode se associar a mudanças na <b>regulação<\/b> dos genes (epigenética), não na sequência do DNA. E os estudos ainda são iniciais, com amostras pequenas.<\/p>"}, {"t": "Herança entre gerações", "q": "<p>Uma reportagem afirma: \"Está provado que o trauma dos avós fica gravado no DNA dos netos\".<\/p><p><b>Com base no módulo, a melhor avaliação dessa frase é:<\/b><\/p>", "o": ["Correta: isso já foi demonstrado em grandes estudos humanos.", "Exagerada: a transmissão por gametas foi demonstrada em animais; em humanos, a evidência é preliminar, e o trauma não altera a sequência do DNA.", "Correta, porque o trauma causa mutações.", "Errada, porque epigenética não existe em humanos.", "Correta, porque ambiente e herança são a mesma coisa."], "a": 1, "x": "<p>Gapp et al. (2014) demonstraram o mecanismo em camundongos. Yehuda et al. (2016) é um estudo humano pequeno e debatido. Em humanos é difícil separar herança epigenética de ambiente, cuidado e cultura compartilhados.<\/p>"}, {"t": "Limites dos biomarcadores", "q": "<p>Uma clínica oferece um \"exame epigenético de sangue que diagnostica depressão\".<\/p><p><b>Qual crítica é mais adequada?<\/b><\/p>", "o": ["Nenhuma: o exame é padrão-ouro.", "A metilação no sangue se correlaciona apenas parcialmente com o cérebro, e não há biomarcador epigenético validado para diagnóstico de depressão.", "O sangue não tem DNA.", "A depressão não tem nenhuma relação com a biologia.", "O exame só seria válido se feito em saliva."], "a": 1, "x": "<p>Especificidade tecidual (Hannon et al., 2015), causalidade incerta e falta de validação clínica impedem esse uso hoje.<\/p>"}]}], "outras": [{"e": "🧩", "nome": "Diversidade da Personalidade"}, {"e": "🤝", "nome": "Psicologia Social"}, {"e": "💡", "nome": "Psicologia Cognitiva"}, {"e": "🌎", "nome": "Psicologia Social e Dinâmicas Culturais"}, {"e": "🔗", "nome": "Conexões entre as disciplinas"}]}</script>
<script>
/* NeuroGenética: versão gratuita do Córtex Lab, com uma disciplina aberta */
let DATA=null;
/* Link de divulgação do Córtex Lab completo (troque pelo seu link de venda, Instagram ou WhatsApp) */
const WHATSAPP='5583998467731';
const WHATSAPP_MSG='Olá, Gabriela! Conheci o NeuroGenética e quero saber mais sobre o Córtex Lab.';
function linkWhats(){ return 'https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(WHATSAPP_MSG); }

/* =========================================================
   ESTADO E ARMAZENAMENTO
   ========================================================= */
const KEY='neurogenetica:v1';
let STORE={};
try{ STORE=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ STORE={}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(STORE)); }catch(e){} }
/* Pede ao navegador para não apagar o progresso automaticamente */
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
/* Sequência de dias de estudo */
function marcarDia(){ if(!STORE._dias||typeof STORE._dias!=='object') STORE._dias={}; STORE._dias[hoje()]=1; }
function sequenciaDias(){ const d=STORE._dias||{}; let n=0; const x=new Date(); if(!d[fmt(x)]) x.setDate(x.getDate()-1); while(d[fmt(x)]){ n++; x.setDate(x.getDate()-1); } return n; }
let disc=null;
function prepararDados(){
  DATA.disciplinas.forEach(d=>{
    d.modulos.forEach(m=>m.conceitos.forEach((c,i)=>{ c.id=m.id+'c'+(i+1); }));
    d.flashcards.forEach((c,i)=>{ c.id='f'+(i+1); });
    d.quiz.forEach((q,i)=>{ q.id='q'+(i+1); });
  });
  disc=DATA.disciplinas.find(d=>d.id===STORE._disc)||DATA.disciplinas[0];
}
function S(){
  if(!STORE[disc.id]) STORE[disc.id]={};
  const s=STORE[disc.id];
  ['conceitos','revelados','cards','quiz','resp','checks','abertas','qstat'].forEach(k=>{ if(!s[k]||typeof s[k]!=='object') s[k]={}; });
  if(typeof s.pomos!=='number') s.pomos=0;
  return s;
}

/* Datas */
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hoje(){ return fmt(new Date()); }
function maisDias(n){ const d=new Date(); d.setDate(d.getDate()+n); return fmt(d); }

/* Utilitários */
const $=s=>document.querySelector(s);
const app=$('#app');
function esc(t){ return String(t).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function embaralhar(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function modPorId(id){ return disc.modulos.find(m=>m.id===id); }
function idxMod(id){ return disc.modulos.findIndex(m=>m.id===id); }
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* Progresso */
function progModulo(m){ const s=S(); const n=m.conceitos.filter(c=>s.conceitos[c.id]).length; return m.conceitos.length?n/m.conceitos.length:0; }
function totalConceitos(){ return disc.modulos.reduce((a,m)=>a+m.conceitos.length,0); }
function conceitosFeitos(){ const s=S(); return disc.modulos.reduce((a,m)=>a+m.conceitos.filter(c=>s.conceitos[c.id]).length,0); }
function cardsDominados(){ const s=S(); return disc.flashcards.filter(c=>s.cards[c.id]&&s.cards[c.id].box>=3).length; }
function cardsPendentes(filtro){ const s=S(); const h=hoje(); return disc.flashcards.filter(c=>(filtro==='all'||c.m===filtro)&&(!s.cards[c.id]||s.cards[c.id].due<=h)); }
function quizMedia(){ const s=S(); const v=Object.values(s.quiz); if(!v.length) return 0; return v.reduce((a,b)=>a+b,0)/v.length; }
function estudoRespondidas(){ const s=S(); return disc.estudo.filter((e,i)=> e.o ? typeof s.resp[i]==='number' : String(s.resp[i]||'').trim().length>=30).length; }
function dominioGeral(){
  const a=conceitosFeitos()/totalConceitos();
  const b=cardsDominados()/disc.flashcards.length;
  const c=quizMedia();
  const d=estudoRespondidas()/disc.estudo.length;
  return (a+b+c+d)/4;
}
function dominioDe(d){ const prev=disc; disc=d; const v=dominioGeral(); disc=prev; return v; }
/* Sistema adaptativo: identifica onde você precisa fortalecer */
function questoesErradas(){ const s=S(); return disc.quiz.filter(q=>s.qstat[q.id]&&s.qstat[q.id].u===0); }
function cardsDificeis(mid){ const s=S(); return disc.flashcards.filter(f=>(!mid||f.m===mid)&&s.cards[f.id]&&(s.cards[f.id].box<=1||(s.cards[f.id].erros||0)>=2)); }
function analiseModulos(){
  const s=S();
  return disc.modulos.map((m,i)=>{
    let c=0,e=0,errAgora=0;
    disc.quiz.filter(q=>q.m===m.id).forEach(q=>{ const st=s.qstat[q.id]; if(st){ c+=st.c; e+=st.e; if(st.u===0) errAgora++; } });
    const cs=disc.flashcards.filter(f=>f.m===m.id);
    const vistos=cs.filter(f=>s.cards[f.id]).length;
    const dificeis=cardsDificeis(m.id).length;
    const caixa=cs.length?cs.reduce((a,f)=>a+((s.cards[f.id]&&s.cards[f.id].box)||0),0)/(cs.length*5):0;
    const conc=progModulo(m);
    const acc=(c+e)?c/(c+e):null;
    const dom=(acc===null?0:acc)*0.45+caixa*0.35+conc*0.2;
    const atividade=(c+e)+vistos+m.conceitos.filter(x=>s.conceitos[x.id]).length;
    return {m,i,c,e,acc,errAgora,dificeis,conc,dom,atividade};
  });
}
function painelReforco(){
  const an=analiseModulos();
  const ativos=an.filter(x=>x.atividade>0);
  const nErr=questoesErradas().length;
  if(!ativos.length) return `<div class="panel small muted">Comece pela Trilha e faça um quiz ou uma revisão de cards. A partir das suas respostas, o app vai mostrar aqui onde você precisa fortalecer.</div>`;
  const fracos=ativos.filter(x=>x.errAgora>0||x.dificeis>0||(x.acc!==null&&x.acc<0.7)).sort((a,b)=>a.dom-b.dom).slice(0,3);
  const nao=an.filter(x=>x.atividade===0);
  const itens=fracos.map(x=>{
    const mot=[];
    if(x.acc!==null) mot.push(`<span class="pill">✅ ${Math.round(x.acc*100)}% de acerto</span>`);
    if(x.errAgora) mot.push(`<span class="pill">❌ ${x.errAgora} ${x.errAgora>1?'questões':'questão'} para refazer</span>`);
    if(x.dificeis) mot.push(`<span class="pill">🃏 ${x.dificeis} ${x.dificeis>1?'cards difíceis':'card difícil'}</span>`);
    mot.push(`<span class="pill">📖 ${Math.round(x.conc*100)}% dos conceitos</span>`);
    return `<div class="item m${x.i+1}"><span class="ie">${x.m.e}</span><div><b>${esc(x.m.nome)}</b>
      <div class="motivos">${mot.join('')}</div>
      <div class="row">
        <button class="btn sm primary" data-act="rquiz" data-v="${x.m.id}">✅ Quiz do módulo</button>
        ${x.dificeis?`<button class="btn sm" data-act="rcards" data-v="${x.m.id}">🃏 Cards difíceis</button>`:''}
        <button class="btn sm ghost" data-act="mod" data-v="${x.m.id}">📖 Rever</button>
      </div></div></div>`;
  }).join('');
  return `<div class="panel reforco">
    ${itens || `<p class="small muted" style="margin:0 0 8px">Nenhum ponto fraco detectado agora nos módulos que você já estudou. Continue revisando os cards para consolidar.</p>`}
    ${nErr?`<div class="row" style="margin-top:10px"><button class="btn" data-act="qerros">🎯 Refazer meus erros (${nErr})</button></div>`:''}
    ${nao.length?`<p class="small muted" style="margin:12px 0 0">Ainda não iniciados: ${nao.map(x=>`<a href="#" data-act="mod" data-v="${x.m.id}">${x.m.e} ${esc(x.m.curto)}</a>`).join(', ')}</p>`:''}
  </div>`;
}
/* Instalação como aplicativo */
let PROMPT_INSTALAR=null, SW_OK=false;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); PROMPT_INSTALAR=e; if(VIEW==='home'&&DATA) renderHome(); });
function emApp(){ try{ return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true; }catch(e){ return false; } }
function blocoInstalar(){
  if(emApp()||!SW_OK) return '';
  if(PROMPT_INSTALAR) return `<button class="btn sm primary" data-act="instalar">📲 Instalar o app</button>`;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  return ios?`<p class="small muted" style="margin:0">📲 Para instalar no iPhone: no Safari, toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</p>`
            :`<p class="small muted" style="margin:0">📲 Para instalar: abra o menu do navegador e toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</p>`;
}

/* =========================================================
   NAVEGAÇÃO
   ========================================================= */
let VIEW='home', PARAM=null;
function go(v,p){
  VIEW=v; PARAM=p===undefined?null:p;
  document.querySelectorAll('.tab').forEach(t=>{
    const alvo=t.dataset.v;
    const ativo = alvo===v || (v==='modulo'&&alvo==='trilha');
    if(ativo) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current');
  });
  render();
  window.scrollTo(0,0);
}
function render(){
  $('#discName').textContent=disc.e+' '+disc.nome+' ▾';
  if(VIEW==='home') renderHome();
  else if(VIEW==='trilha') renderTrilha();
  else if(VIEW==='modulo') renderModulo(PARAM);
  else if(VIEW==='cards') renderCards();
  else if(VIEW==='quiz') renderQuiz();
  else if(VIEW==='estudo') renderEstudo();
  else if(VIEW==='foco') renderFoco();
  else if(VIEW==='acessos') renderAcessos();
}

/* =========================================================
   INÍCIO
   ========================================================= */
function heroSVG(){
  const n=disc.modulos.length; const H=n===4?200:222; const cy=n===4?100:104;
  const pos = n===4 ? [[62,54],[278,54],[62,148],[278,148]] : disc.modulos.map((_,i)=>{ const ang=(-90+180/n+i*360/n)*Math.PI/180; return [Math.round(170+116*Math.cos(ang)), Math.round(cy+72*Math.sin(ang))]; });
  let lines='', nodes='';
  disc.modulos.forEach((m,i)=>{
    const p=progModulo(m); const [x,y]=pos[i]; const C=2*Math.PI*22; const cor='var(--c'+(i+1)+')';
    lines+=`<line x1="170" y1="${cy}" x2="${x}" y2="${y}" stroke="${cor}" stroke-width="2" stroke-opacity="${(0.2+p*0.8).toFixed(2)}" ${p>0?'':'stroke-dasharray="3 5"'}/>`;
    nodes+=`<g class="node" data-act="mod" data-v="${m.id}" tabindex="0" role="button" aria-label="Abrir módulo ${esc(m.nome)}, ${Math.round(p*100)}% compreendido">
      <circle cx="${x}" cy="${y}" r="22" fill="var(--surface2)" stroke="var(--line)" stroke-width="3"/>
      <circle cx="${x}" cy="${y}" r="22" fill="none" stroke="${cor}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${x} ${y})"/>
      <text x="${x}" y="${y+6}" text-anchor="middle" font-size="17">${m.e}</text>
      <text x="${x}" y="${y+38}" text-anchor="middle" class="nlabel">${esc(m.curto)} ${Math.round(p*100)}%</text></g>`;
  });
  const deco=[[118,30],[222,30],[118,172],[222,172],[20,100],[320,100],[170,24],[170,178]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.2" fill="var(--muted)" opacity=".35"/>`).join('');
  const dom=Math.round(dominioGeral()*100);
  return `<svg class="map" viewBox="0 0 340 ${H}" role="img" aria-label="Mapa neural do seu progresso: domínio geral ${dom}%">
    ${deco}${lines}
    <circle cx="170" cy="${cy}" r="34" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="170" cy="${cy}" r="41" fill="none" stroke="var(--accent)" stroke-opacity=".25" stroke-width="1"/>
    <text x="170" y="${cy+3}" text-anchor="middle" class="ctxt">${dom}%</text>
    <text x="170" y="${cy+17}" text-anchor="middle" class="csub">domínio</text>
    ${nodes}</svg>`;
}
function renderHome(){
  const s=S();
  const pend=cardsPendentes('all').length;
  const edPend=disc.estudo.length-estudoRespondidas();
  app.innerHTML=`
  <h2 style="margin-top:0">💾 Seu progresso</h2>
  <div class="panel stack">
    ${blocoInstalar()}
    <p class="small muted" style="margin:0">Fica salvo automaticamente neste aparelho. Para levar a outro aparelho, exporte um backup aqui e importe lá.</p>
    <div class="row"><button class="btn sm" data-act="exportar">⬇️ Exportar backup</button><button class="btn sm" data-act="importar">⬆️ Importar backup</button></div>
    <input type="file" id="arqBackup" accept="application/json,.json" hidden>
  </div>

  <h2 id="disciplinas">🚀 Saiba mais</h2>
  ${blocoPromo()}

  <h2>📖 Seu estudo</h2>
  <section class="hero">
    <h1>${esc(disc.nome)}</h1>
    <p class="lead">${esc(disc.desc)} Toque num nó do mapa para abrir o módulo.</p>
    ${heroSVG()}
    ${sequenciaDias()?`<span class="streak">🔥 ${sequenciaDias()} ${sequenciaDias()>1?'dias seguidos':'dia'} de estudo</span>`:''}
    <div class="stats">
      <div class="stat"><b>${conceitosFeitos()}/${totalConceitos()}</b><span>conceitos compreendidos</span></div>
      <div class="stat"><b>${cardsDominados()}/${disc.flashcards.length}</b><span>cards dominados</span></div>
      <div class="stat"><b>${Math.round(quizMedia()*100)}%</b><span>média nos quizzes</span></div>
      <div class="stat"><b>${s.pomos}</b><span>blocos de foco</span></div>
    </div>
  </section>

  <h2>📅 Para hoje</h2>
  <div class="today">
    <div class="panel"><span class="big">${pend}</span><span class="small muted">cards para revisar</span>
      <button class="btn primary sm" data-act="go" data-v="cards">Revisar cards</button></div>
    <div class="panel"><span class="big">${edPend}</span><span class="small muted">questões do estudo dirigido sem resposta</span>
      <button class="btn sm" data-act="go" data-v="estudo">Responder</button></div>
  </div>

  <h2>🎯 Onde fortalecer</h2>
  ${painelReforco()}


  <h2>🧠 Como este espaço ajuda seu cérebro</h2>
  <div class="tech">
    <div><span class="e">🔁</span><p style="margin:0"><b>Recuperação ativa</b><span>Tentar lembrar fortalece a memória mais do que reler. Por isso as ideias-chave ficam escondidas até você tentar.</span></p></div>

function avaliar(nota){
  const s=S(); const id=CS.fila[CS.i]; const c=s.cards[id]||{box:0,vistos:0};
  let box=c.box||0;
  if(nota===0) box=1; else if(nota===1) box=Math.max(1,box); else box=Math.min(5,box+1);
  const dias = nota===0 ? 0 : Math.max(1,INTERVALOS[box]);
  s.cards[id]={box, due:maisDias(dias), vistos:(c.vistos||0)+1, erros:(c.erros||0)+(nota===0?1:0)};
  marcarDia(); save();
  if(nota===0) CS.fila.push(id);
  CS.i++; CS.virado=false; CS.feitos++;
  renderCards();
}

let QS={filtro:'all', qs:[], i:0, acertos:0, resp:null, modo:'normal', errosMod:{}};
/* Prioridade: errou da última vez > ainda não vista > acertou poucas vezes > já dominada */
function prioridadeQ(q){ const st=S().qstat[q.id]; if(!st) return 2; if(st.u===0) return 3; return st.e>st.c?2.5:1/(1+st.c); }
function iniciarQuiz(modo){
  QS.modo=modo||'normal';
  let base = QS.modo==='erros' ? questoesErradas() : disc.quiz.filter(q=>QS.filtro==='all'||q.m===QS.filtro);
  base = base.map(q=>({q, p:prioridadeQ(q)+Math.random()*1.2})).sort((a,b)=>b.p-a.p).map(x=>x.q);
  QS.qs=embaralhar(base.slice(0,10)).map(q=>{ const ordem=embaralhar(q.o.map((_,k)=>k)); return {q, ordem}; });

}

/* =========================================================
   FOCO (Pomodoro)
   ========================================================= */
const T={modo:'foco', dur:25*60, rest:25*60, rodando:false, id:null, fim:0};
function setModo(modo){
  T.modo=modo; T.dur=(modo==='foco'?25:5)*60; T.rest=T.dur; T.rodando=false; clearInterval(T.id);
  atualizaTimer();
}
function mmss(t){ return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
function bip(){
  try{ const AC=window.AudioContext||window.webkitAudioContext; const ctx=new AC();
    [0,0.35,0.7].forEach(off=>{ const o=ctx.createOscillator(); const g=ctx.createGain(); o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,ctx.currentTime+off); g.gain.exponentialRampToValueAtTime(0.2,ctx.currentTime+off+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+off+0.25);
      o.start(ctx.currentTime+off); o.stop(ctx.currentTime+off+0.3); });
  }catch(e){}
}
function tick(){
  T.rest=Math.max(0,Math.round((T.fim-Date.now())/1000));
  if(T.rest<=0){
    clearInterval(T.id); T.rodando=false; bip();
    if(T.modo==='foco'){ S().pomos++; save(); toast('🎉 Bloco concluído! Antes da pausa, lembre 3 ideias sem olhar.'); setModo('pausa'); }
    else { toast('⏱️ Pausa encerrada. Pronta para outro bloco?'); setModo('foco'); }
    return;
  }
  atualizaTimer();
}
function atualizaTimer(){
  $('#focoLbl').textContent = T.rodando ? mmss(T.rest) : 'Foco';
  if(VIEW!=='foco') return;
  const C=2*Math.PI*96; const frac=T.rest/T.dur;
  const arc=document.getElementById('tarc'), num=document.getElementById('tnum'), md=document.getElementById('tmd'), bt=document.getElementById('tbtn');
  if(arc) arc.setAttribute('stroke-dasharray',(C*frac).toFixed(1)+' '+C.toFixed(1));
  if(num) num.textContent=mmss(T.rest);
  if(md) md.textContent=T.modo==='foco'?'bloco de foco':'pausa';
  if(bt) bt.textContent=T.rodando?'⏸ Pausar':'▶ Iniciar';
}
function renderFoco(){
  const C=2*Math.PI*96;
  app.innerHTML=`<h1>⏱️ Foco</h1>
    <p class="lead">25 minutos de estudo, 5 de pausa. Na pausa, levante, beba água e deixe o celular de lado.</p>
    <div class="panel timer">
      <div class="chips" style="justify-content:center;margin-top:0">
        <button class="chip" data-act="tmodo" data-v="foco" aria-pressed="${T.modo==='foco'}">🎯 Foco 25</button>
        <button class="chip" data-act="tmodo" data-v="pausa" aria-pressed="${T.modo==='pausa'}">☕ Pausa 5</button>
      </div>
      <svg viewBox="0 0 230 230" aria-hidden="true">
        <circle cx="115" cy="115" r="96" fill="none" stroke="var(--surface2)" stroke-width="10"/>
        <circle id="tarc" cx="115" cy="115" r="96" fill="none" stroke="${T.modo==='foco'?'var(--accent)':'var(--ok)'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C} ${C}" transform="rotate(-90 115 115)"/>
        <text id="tnum" x="115" y="122" text-anchor="middle" class="tnum">${mmss(T.rest)}</text>
        <text id="tmd" x="115" y="148" text-anchor="middle" class="tmode">${T.modo==='foco'?'bloco de foco':'pausa'}</text>
      </svg>
      <div role="timer" aria-live="off" class="row" style="justify-content:center;margin-top:10px">
        <button class="btn primary" id="tbtn" data-act="tplay">${T.rodando?'⏸ Pausar':'▶ Iniciar'}</button>
        <button class="btn" data-act="treset">↺ Reiniciar</button>
      </div>
      <p class="small muted" style="margin-top:12px">Blocos concluídos nesta disciplina: <b>${S().pomos}</b></p>
    </div>
    <h2>🧭 Ritual de um bloco</h2>
    <div class="panel"><ol class="rit">
      <li><b>Antes:</b> escolha um único módulo ou uma questão do estudo dirigido.</li>
      <li><b>Durante:</b> leia um conceito, feche os olhos e explique em voz alta.</li>
      <li><b>No fim:</b> anote 3 ideias que lembra sem olhar.</li>
      <li><b>Depois da pausa:</b> faça os cards do mesmo módulo.</li>
    </ol></div>`;
  atualizaTimer();
}

/* =========================================================
   AÇÕES (delegação de eventos)
   ========================================================= */
const ACOES={
  go:v=>go(v),
  mod:v=>go('modulo',v),
  trocar:()=>go('trilha'),
  disc:v=>{
    const d=DATA.disciplinas.find(x=>x.id===v); if(!d) return;
    if(d.id===disc.id){ go('trilha'); window.scrollTo(0,0); return; }
    disc=d; STORE._disc=d.id; save();
    CS={filtro:'all', fila:[], i:0, virado:false, treino:false, feitos:0};
    QS={filtro:'all', qs:[], i:0, acertos:0, resp:null};
    go('trilha'); window.scrollTo(0,0); toast(d.e+' '+d.nome);
  },
  edop:v=>{ const [i,k]=v.split(':').map(Number); const s=S(); s.resp[i]=k; s.abertas[i]=true; save(); const y=window.scrollY; renderEstudo(); window.scrollTo(0,y); },
  edreset:v=>{ const s=S(); delete s.resp[v]; save(); const y=window.scrollY; renderEstudo(); window.scrollTo(0,y); },
  tema:()=>{
    const r=document.documentElement;
    const atual=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    const novo=atual==='dark'?'light':'dark';
    r.setAttribute('data-theme',novo); STORE._tema=novo; save();
  },
  revelar:v=>{ S().revelados[v]=true; save(); const y=window.scrollY; renderModulo(PARAM); window.scrollTo(0,y); },
  entendi:v=>{ const s=S(); s.conceitos[v]=!s.conceitos[v]; if(s.conceitos[v]){ s.revelados[v]=true; marcarDia(); } save(); const y=window.scrollY; renderModulo(PARAM); window.scrollTo(0,y); if(s.conceitos[v]) toast('✓ Conceito marcado como compreendido'); },
  cfiltro:v=>{ CS.filtro=v; CS.fila=[]; CS.feitos=0; renderCards(); },
  cstart:()=>{ iniciarCards(false); renderCards(); },
  ctreino:()=>{ iniciarCards(true); renderCards(); },
  csair:()=>{ CS.fila=[]; renderCards(); },
  cvirar:()=>{ if(!CS.virado){ CS.virado=true; renderCards(); } },
  nota:v=>avaliar(Number(v)),
  qfiltro:v=>{ QS.filtro=v; renderQuiz(); },
  qstart:()=>{ iniciarQuiz(); renderQuiz(); },
  qsair:()=>{ QS.qs=[]; renderQuiz(); },
  qop:v=>{
    if(QS.resp!==null) return; QS.resp=Number(v);
    const q=QS.qs[QS.i].q; const ok=QS.resp===q.a;
    if(ok) QS.acertos++; else QS.errosMod[q.m]=(QS.errosMod[q.m]||0)+1;
    const s=S(); const st=s.qstat[q.id]||{c:0,e:0}; if(ok) st.c++; else st.e++; st.u=ok?1:0; s.qstat[q.id]=st;
    marcarDia(); save(); renderQuiz();
  },
  qerros:()=>{ iniciarQuiz('erros'); if(!QS.qs.length){ toast('🎉 Nenhuma questão errada para refazer'); return; } go('quiz'); },
  rquiz:v=>{ QS.filtro=v; iniciarQuiz(); go('quiz'); },
  rcards:v=>{ CS.filtro=v; const dif=cardsDificeis(v); const base=dif.length?dif:disc.flashcards.filter(f=>f.m===v); CS.fila=embaralhar(base).slice(0,20).map(c=>c.id); CS.i=0; CS.virado=false; CS.treino=true; CS.feitos=0; go('cards'); },
  querer:()=>{ const c=$('#convite'); $('#btnZap').href=linkWhats(); c.hidden=false; },
  fecharConvite:()=>{ $('#convite').hidden=true; },
  instalar:()=>{ if(!PROMPT_INSTALAR) return; PROMPT_INSTALAR.prompt(); PROMPT_INSTALAR.userChoice.finally(()=>{ PROMPT_INSTALAR=null; if(VIEW==='home') renderHome(); }); },
  exportar:()=>{
    const nome='neurogenetica-backup-'+hoje()+'.json';
    try{
      const blob=new Blob([JSON.stringify({app:'neurogenetica',versao:1,data:new Date().toISOString(),store:STORE})],{type:'application/json'});
      let file=null; try{ file=new File([blob],nome,{type:'application/json'}); }catch(e){}
      if(file && navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file],title:'Backup do NeuroGenética'}).catch(()=>{}); return; }
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
      toast('⬇️ Backup exportado');
    }catch(e){ toast('Não foi possível exportar neste navegador'); }
  },
  importar:()=>{ const i=document.getElementById('arqBackup'); if(i){ i.value=''; i.click(); } },
  qnext:()=>{ QS.i++; QS.resp=null; renderQuiz(); window.scrollTo(0,0); },
  edMontar:()=>{
    const s=S(); const partes=[]; const faltam=[];
    disc.estudo.forEach((e,i)=>{ if(!e.atividade) return;
      const t=String(s.resp[i]||'').trim();
      if(t.length<30) faltam.push(e.tt.split('.')[0]);
      if(t) partes.push(e.tt.replace(/^Etapa \d+\.\s*/,'').toUpperCase()+'\n'+t);
    });
    const ta=document.getElementById('montado'); const av=document.getElementById('montarAviso');
    if(!partes.length){ ta.hidden=true; av.textContent='✍️ Escreva pelo menos uma etapa antes de juntar.'; return; }
    ta.value=partes.join('\n\n'); ta.hidden=false;
    const pal=ta.value.split(/\s+/).filter(Boolean).length;
    av.innerHTML='📝 '+pal+' palavras.'+(faltam.length?' Ainda falta desenvolver: <b>'+esc(faltam.join(', '))+'</b>.':' Todas as etapas têm texto. Agora transforme em um texto corrido, com introdução e conclusão.');
  },
  edCopiar:()=>{
    const ta=document.getElementById('montado');
    if(!ta || ta.hidden || !ta.value){ ACOES.edMontar(); if(!ta || ta.hidden) return; }
    const ok=()=>toast('📋 Texto copiado');
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(ok,()=>{ ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){ toast('Selecione o texto e copie manualmente'); } }); }
    else { ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){ toast('Selecione o texto e copie manualmente'); } }
  },
  edcomp:v=>{
    const s=S(); const el=document.getElementById('mod'+v);
    const ta=document.getElementById('ta'+v);
    if(!disc.estudo[v].livre && ta && ta.value.trim().length<30 && el.hidden){ toast('✍️ Escreva sua resposta antes de comparar'); ta.focus(); return; }
    el.hidden=!el.hidden; s.abertas[v]=el.hidden?true:'modelo'; save();
  },
  tmodo:v=>{ setModo(v); renderFoco(); },
  tplay:()=>{
    if(T.rodando){ clearInterval(T.id); T.rodando=false; }
    else { T.fim=Date.now()+T.rest*1000; T.rodando=true; clearInterval(T.id); T.id=setInterval(tick,1000); }
    atualizaTimer();
  },
  treset:()=>{ setModo(T.modo); }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const fn=ACOES[el.dataset.act]; if(fn){ e.preventDefault(); fn(el.dataset.v,el,e); }
});
document.addEventListener('click',e=>{ if(e.target.id==='convite') e.target.hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const c=document.getElementById('convite'); if(c) c.hidden=true; } });
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); }
});
document.addEventListener('input',e=>{
  if(e.target.matches('textarea[data-i]')){
    const i=e.target.dataset.i; S().resp[i]=e.target.value; save();
    const st=document.getElementById('st'+i); if(st) st.textContent=statusEstudo(i);
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='arqBackup' && e.target.files && e.target.files[0]){
    const leitor=new FileReader();
    leitor.onload=()=>{
      try{
        const dados=JSON.parse(leitor.result);
        if(!dados || dados.app!=='neurogenetica' || typeof dados.store!=='object') throw new Error('formato');
        if(!confirm('Substituir o progresso deste aparelho pelo progresso do backup?')) return;
        STORE=dados.store; save();
        disc=DATA.disciplinas.find(d=>d.id===STORE._disc)||DATA.disciplinas[0];
        if(STORE._tema) document.documentElement.setAttribute('data-theme',STORE._tema);
        toast('✅ Backup importado'); go('home');
      }catch(err){ toast('Arquivo inválido: escolha um backup do NeuroGenética'); }
    };
    leitor.readAsText(e.target.files[0]);
    return;
  }
  if(e.target.matches('input[data-ci]')){
    const i=e.target.dataset.ci, k=e.target.dataset.ck; const s=S();
    if(!s.checks[i]) s.checks[i]={};
    s.checks[i][k]=e.target.checked; save();
    const st=document.getElementById('st'+i); if(st) st.textContent=statusEstudo(i);
  }
});
document.addEventListener('toggle',e=>{
  if(e.target.matches && e.target.matches('details.ed')){
    const i=e.target.dataset.i; const s=S();
    if(e.target.open){ if(!s.abertas[i]) s.abertas[i]=true; }
    else { delete s.abertas[i]; }
    save();
  }
},true);

if(STORE._tema) document.documentElement.setAttribute('data-theme',STORE._tema);
DATA=JSON.parse(document.getElementById('conteudo').textContent);

/* Aplicativo instalável e funcionamento sem internet */
function avisoNovaVersao(){
  if(document.getElementById('novaVersao')) return;
  const d=document.createElement('div'); d.id='novaVersao'; d.setAttribute('role','status');
  d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:200;display:flex;gap:10px;align-items:center;background:var(--surface);color:var(--text);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100% - 32px);font-size:.9rem';
  d.innerHTML='<span style="white-space:nowrap">🔄 Versão nova disponível</span><button class="btn sm primary" type="button">Atualizar</button>';
  d.querySelector('button').addEventListener('click',()=>location.reload());
  document.body.appendChild(d);
}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(()=>{ SW_OK=true; if(VIEW==='home'&&DATA) renderHome(); }).catch(()=>{});
    navigator.serviceWorker.addEventListener('message',e=>{ if(e.data==='nova-versao') avisoNovaVersao(); });
  });
}
