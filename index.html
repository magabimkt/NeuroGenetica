<script type="application/json" id="conteudo">{"disciplinas": [{"id": "neuro-genetica", "nome": "Neurociência e Genética Comportamental", "e": "🧬", "desc": "Bases da genética, genética molecular, cérebro e neurotransmissores, genes e ambiente, hereditariedade em transtornos, evolução e epigenética na Psicologia.", "modulos": [{"id": "m1", "e": "🧬", "curto": "Genética", "nome": "Bases da Genética", "desc": "DNA, genes, cromossomos, Mendel, genótipo, fenótipo e probabilidades de herança.", "conceitos": [{"e": "🔎", "t": "O que é Genética", "txt": "<p>A genética estuda como as <b>informações hereditárias<\/b> são transmitidas de uma geração para outra por meio dos genes, explicando a diversidade e as semelhanças entre os seres vivos.<\/p>\n    <div class=\"flow\"><span>🧵 <b>DNA:<\/b> armazena a informação genética<\/span><i>▼<\/i>\n    <span>📍 <b>Genes:<\/b> trechos do DNA que codificam características específicas<\/span><i>▼<\/i>\n    <span>📦 <b>Cromossomos:<\/b> organizam e compactam o DNA<\/span><\/div>", "pq": "Explique a relação entre DNA, gene e cromossomo usando a metáfora de uma biblioteca.", "chave": "DNA guarda a informação, genes são as \"instruções\" e cromossomos são a forma organizada de guardá-las."}, {"e": "🧵", "t": "DNA, genes e alelos", "txt": "<ul><li><b>DNA (ácido desoxirribonucleico):<\/b> molécula em <b>dupla hélice<\/b> de nucleotídeos que carrega as instruções genéticas; está em quase todas as células.<\/li>\n    <li><b>Gene:<\/b> segmento do DNA com instruções para produzir proteínas ou regular funções celulares. Ocupa uma posição fixa no cromossomo, chamada <b>locus<\/b>.<\/li>\n    <li><b>Alelos:<\/b> versões diferentes de um mesmo gene. Alelos iguais = <b>homozigoto<\/b> (AA ou aa); diferentes = <b>heterozigoto<\/b> (Aa).<\/li>\n    <li><b>Expressão gênica:<\/b> uso da informação do DNA para produzir proteínas, em duas etapas: <b>transcrição<\/b> (DNA → RNA) e <b>tradução<\/b> (RNA → proteína).<\/li><\/ul>", "pq": "Qual a diferença entre \"ter um gene\" e \"expressar um gene\"?", "chave": "Gene é o trecho do DNA; alelos são suas versões; expressão é transformar a instrução em proteína."}, {"e": "📦", "t": "Cromossomos, meiose e variabilidade", "txt": "<ul><li>Humanos têm <b>46 cromossomos em 23 pares<\/b>: 22 pares de autossomos e 1 par sexual (XX ou XY).<\/li>\n    <li>Cada cromossomo é uma longa molécula de DNA associada a proteínas chamadas <b>histonas<\/b>, que compactam e regulam o acesso à informação.<\/li>\n    <li><b>Meiose:<\/b> divisão celular que forma os gametas (óvulos e espermatozoides), cada um com 23 cromossomos.<\/li>\n    <li>Na meiose ocorre a <b>recombinação genética<\/b>, que embaralha os alelos dos pais e gera variabilidade em cada geração.<\/li><\/ul>", "pq": "Por que irmãos com os mesmos pais nascem geneticamente diferentes?", "chave": "A meiose e a recombinação garantem que cada gameta, e cada filho, seja uma combinação única."}, {"e": "🎭", "t": "Genótipo e fenótipo", "txt": "<div class=\"scroll\"><table class=\"tb\"><tr><th>Conceito<\/th><th>Definição<\/th><th>Exemplo<\/th><\/tr>\n    <tr><td>Genótipo<\/td><td>Conjunto de genes do indivíduo<\/td><td>AA, Aa ou aa<\/td><\/tr>\n    <tr><td>Fenótipo<\/td><td>Características observáveis = genótipo + ambiente<\/td><td>Cor dos olhos, altura, temperamento<\/td><\/tr>\n    <tr><td>Dominância<\/td><td>Um alelo mascara o outro<\/td><td>Aa expressa o alelo A<\/td><\/tr>\n    <tr><td>Recessividade<\/td><td>O alelo só se expressa em homozigose<\/td><td>Só aa expressa o alelo a<\/td><\/tr>\n    <tr><td>Epigenética<\/td><td>Mudança na expressão sem alterar o DNA<\/td><td>Metilação do DNA<\/td><\/tr><\/table><\/div>\n    <p class=\"key\">O fenótipo não é determinado só pelo genótipo: alimentação, temperatura e exposições ambientais também moldam as características.<\/p>", "pq": "Gêmeos idênticos têm o mesmo genótipo. Eles terão sempre o mesmo fenótipo?", "chave": "Fenótipo = genótipo + ambiente (e o tempo de desenvolvimento entre os dois)."}, {"e": "🌱", "t": "As Leis de Mendel", "txt": "<ul><li><b>1ª lei (segregação):<\/b> cada indivíduo tem dois alelos por gene, que se separam na formação dos gametas; cada gameta leva apenas um.<\/li>\n    <li><b>2ª lei (segregação independente):<\/b> alelos de genes diferentes (em cromossomos diferentes) se distribuem de forma independente.<\/li>\n    <li>Explicam <b>dominância<\/b> e <b>recessividade<\/b> e formam a base do estudo da transmissão de características.<\/li><\/ul>\n    <p class=\"small muted\">Mendel trabalhou com ervilhas no século XIX; suas leis foram \"redescobertas\" no início do século XX.<\/p>", "pq": "Por que um casal sem uma característica recessiva pode ter um filho com ela?", "chave": "Os alelos se separam nos gametas e se recombinam ao acaso na fecundação."}, {"e": "🔢", "t": "Quadro de Punnett: Aa × Aa", "txt": "<p>Dois pais <b>heterozigotos<\/b> (Aa) para uma característica <b>autossômica recessiva<\/b>:<\/p>\n    <table class=\"punnett\"><tr><th><\/th><th>A<\/th><th>a<\/th><\/tr>\n    <tr><th>A<\/th><td>AA<\/td><td>Aa<\/td><\/tr>\n    <tr><th>a<\/th><td>Aa<\/td><td class=\"af\">aa<\/td><\/tr><\/table>\n    <ul><li><b>AA:<\/b> 1/4 = 25% (não afetado, não portador)<\/li>\n    <li><b>Aa:<\/b> 2/4 = 50% (portador, não afetado)<\/li>\n    <li><b>aa:<\/b> 1/4 = 25% (<b>afetado<\/b>)<\/li><\/ul>\n    <p>Proporção fenotípica <b>3 : 1<\/b> (75% com o fenótipo dominante, 25% com o recessivo).<\/p>\n    <p class=\"key\">Cada gestação é um evento independente: as probabilidades se repetem a cada filho. Ter um filho afetado não muda a chance do próximo.<\/p>", "pq": "Se o casal já tem um filho aa, qual a chance de o segundo também ser aa?", "chave": "Aa × Aa: 25% AA, 50% Aa, 25% aa, renovados a cada gestação."}, {"e": "🧭", "t": "Princípios fundamentais e genética e sociedade", "txt": "<ul><li><b>Do DNA ao organismo:<\/b> a informação flui do DNA para o RNA e deste para as proteínas: o <b>Dogma Central<\/b> da Biologia Molecular.<\/li>\n    <li><b>Herança mendeliana:<\/b> alelos se segregam de forma previsível.<\/li>\n    <li><b>Variabilidade genética:<\/b> mutações e recombinações geram diversidade, a matéria-prima da evolução.<\/li>\n    <li><b>Genética e sociedade:<\/b> testes genéticos, terapias gênicas e transgênicos aplicam esses princípios na medicina, agricultura e biotecnologia.<\/li><\/ul>", "pq": "Que dilema ético um teste genético para risco psiquiátrico pode trazer?", "chave": "DNA → RNA → proteína; variabilidade é o combustível da evolução."}]}, {"id": "m2", "e": "🔬", "curto": "Molecular", "nome": "Genética Molecular", "desc": "Livro de Ribeiro (2009): estrutura do DNA, replicação, fluxo da informação e variabilidade.", "conceitos": [{"e": "📜", "t": "Histórico: como se descobriu que o gene é DNA", "txt": "<p>Após a redescoberta de Mendel, o desafio era saber <b>do que os genes eram feitos<\/b>. Cromossomos têm DNA e proteínas, e muitos achavam que eram as proteínas, por serem mais variadas.<\/p>\n    <div class=\"flow\"><span>🐭 <b>Griffith (1928):<\/b> o \"princípio transformante\": bactérias mortas transformavam bactérias vivas<\/span><i>▼<\/i>\n    <span>🧪 <b>Avery, MacLeod e McCarty (1944):<\/b> o princípio transformante é o DNA<\/span><i>▼<\/i>\n    <span>🦠 <b>Hershey e Chase (1952):<\/b> confirmação com vírus bacteriófagos<\/span><i>▼<\/i>\n    <span>🌀 <b>Watson e Crick (1953):<\/b> modelo da dupla hélice, a partir de dados de difração de raios X (com papel decisivo de Rosalind Franklin)<\/span><\/div>", "pq": "Por que era razoável, na época, achar que as proteínas carregavam a herança?", "chave": "Experimentos de Griffith, Avery e colaboradores mostraram que o DNA é o material genético; Watson e Crick descreveram sua estrutura."}, {"e": "🌀", "t": "Estrutura molecular do DNA", "txt": "<ul><li><b>Nucleotídeo<\/b> = fosfato + açúcar (<b>desoxirribose<\/b>) + base nitrogenada.<\/li>\n    <li>Quatro bases: <b>A<\/b>denina, <b>T<\/b>imina, <b>C<\/b>itosina, <b>G<\/b>uanina. Purinas: A e G; pirimidinas: C e T.<\/li>\n    <li><b>Pareamento complementar:<\/b> A–T (2 pontes de hidrogênio) e C–G (3 pontes).<\/li>\n    <li>Duas fitas <b>antiparalelas<\/b> (uma 5'→3', outra 3'→5') formando a dupla hélice.<\/li>\n    <li>Regularidade, sequência linear de bases e pareamento estão ligados à função: guardar e copiar informação.<\/li><\/ul>", "pq": "Se uma fita tem a sequência ATGC, qual é a sequência complementar?", "chave": "A pareia com T, C pareia com G; as fitas são complementares e antiparalelas. (Resposta: TACG.)"}, {"e": "🧶", "t": "Tipos de sequência e organização", "txt": "<ul><li><b>Sequências únicas:<\/b> contêm informação para construir proteínas.<\/li>\n    <li><b>Sequências repetitivas:<\/b> o livro (2009) as descreve como de função desconhecida, o chamado \"DNA lixo\".<\/li>\n    <li><b>Organização:<\/b> DNA enrolado em histonas forma o <b>nucleossomo<\/b>, que se compacta em cromatina e, na divisão celular, em cromossomos.<\/li>\n    <li>A similaridade estrutural do DNA em todos os seres vivos é um <b>conceito unificador<\/b> da Biologia.<\/li><\/ul>\n    <p class=\"small muted\">Atualização: pesquisas posteriores (como o projeto ENCODE) mostraram que muitas regiões não codificantes têm funções regulatórias. Por isso, o termo \"DNA lixo\" é hoje considerado impreciso.<\/p>", "pq": "Por que é perigoso chamar de \"lixo\" algo cuja função ainda não conhecemos?", "chave": "Genoma eucariótico = sequências únicas (codificam proteínas) + repetitivas; o DNA se organiza em nucleossomos e cromossomos."}, {"e": "🪞", "t": "Replicação do DNA", "txt": "<ul><li><b>Semiconservativa:<\/b> cada nova molécula tem uma fita antiga e uma nova (Meselson e Stahl, 1958).<\/li>\n    <li><b>DNA polimerase:<\/b> principal enzima; sintetiza sempre no sentido <b>5'→3'<\/b>, com alta precisão.<\/li>\n    <li>Replicação <b>bidirecional<\/b>; uma fita é contínua e a outra <b>descontínua<\/b> (fragmentos de Okazaki).<\/li>\n    <li>Outras enzimas: helicase (abre a dupla hélice), primase (faz o primer), SSB (estabiliza fitas simples), ligase (une fragmentos), topoisomerases (aliviam a torção).<\/li>\n    <li>Eucariotos têm <b>várias origens<\/b> de replicação por cromossomo.<\/li>\n    <li><b>Telômeros:<\/b> as pontas dos cromossomos encurtam a cada ciclo; a enzima <b>telomerase<\/b> recompõe esse encurtamento em algumas células.<\/li><\/ul>", "pq": "Por que a replicação precisa de tantas enzimas diferentes trabalhando juntas?", "chave": "Replicação semiconservativa, 5'→3', bidirecional, com fita contínua e descontínua; telômeros encurtam a cada ciclo."}, {"e": "➡️", "t": "Fluxo da informação: transcrição", "txt": "<p><b>RNA<\/b> difere do DNA por ter <b>ribose<\/b>, <b>uracila<\/b> (U no lugar de T) e geralmente fita simples.<\/p>\n    <ul><li><b>Transcrição:<\/b> síntese de RNA a partir de um molde de DNA, feita pela <b>RNA polimerase<\/b>, no sentido 5'→3'.<\/li>\n    <li>Começa no <b>promotor<\/b>, sítio onde a RNA polimerase se liga. Em procariotos atua a subunidade sigma; em eucariotos, os <b>fatores de transcrição<\/b>.<\/li>\n    <li><b>Processamento em eucariotos:<\/b> o RNA recebe um <b>CAP<\/b> na ponta 5' e uma <b>cauda poli-A<\/b> na 3'. No <b>splicing<\/b>, os <b>íntrons<\/b> são removidos e os <b>éxons<\/b> unidos.<\/li><\/ul>", "pq": "Por que o splicing permite que um gene gere mais de uma proteína?", "chave": "Transcrição: DNA → RNA pela RNA polimerase a partir do promotor; em eucariotos o RNA é processado (CAP, poli-A, splicing)."}, {"e": "🔤", "t": "Tipos de RNA e código genético", "txt": "<ul><li><b>mRNA (mensageiro):<\/b> leva a sequência que especifica os aminoácidos.<\/li>\n    <li><b>rRNA (ribossômico):<\/b> parte estrutural e funcional dos ribossomos.<\/li>\n    <li><b>tRNA (transportador):<\/b> leva aminoácidos ao ribossomo; seu <b>anticódon<\/b> pareia com o códon do mRNA.<\/li><\/ul>\n    <p><b>Código genético:<\/b><\/p>\n    <ul><li>Cada <b>códon<\/b> = 3 nucleotídeos; com 4 bases há <b>64 combinações<\/b> para só <b>20 aminoácidos<\/b>, por isso o código é <b>redundante<\/b> (degenerado).<\/li>\n    <li><b>AUG<\/b> é o códon de início (metionina); <b>3 códons de parada<\/b> (UAA, UAG, UGA) não codificam aminoácidos.<\/li>\n    <li>É praticamente <b>universal<\/b>: um organismo \"lê\" o gene de outro.<\/li><\/ul>", "pq": "Por que a redundância do código protege contra algumas mutações?", "chave": "Trincas de bases (códons) especificam aminoácidos; o código é redundante e universal."}, {"e": "🏭", "t": "Tradução e diferenças entre células", "txt": "<ul><li><b>Tradução:<\/b> nos ribossomos, a sequência do mRNA é lida códon a códon e os aminoácidos são unidos em uma cadeia polipeptídica.<\/li>\n    <li><b>Procariotos:<\/b> transcrição e tradução ocorrem ao mesmo tempo, no mesmo local; um mRNA pode codificar vários polipeptídeos.<\/li>\n    <li><b>Eucariotos:<\/b> separação no espaço e no tempo (transcrição no núcleo, tradução no citoplasma) e processamento do RNA.<\/li><\/ul>", "pq": "Que vantagem a separação núcleo × citoplasma traz para a regulação gênica?", "chave": "Tradução = mRNA → proteína no ribossomo; em eucariotos há separação entre transcrição e tradução."}, {"e": "⚡", "t": "Mutação", "txt": "<p>\"Mutação\" designa tanto o processo que altera o DNA quanto suas consequências.<\/p>\n    <ul><li><b>Cromossômicas:<\/b> conjuntos inteiros (<b>euploidias<\/b>) ou cromossomos individuais (<b>aneuploidias<\/b>, ex.: trissomia do 21).<\/li>\n    <li><b>Gênicas:<\/b> mudanças na sequência de nucleotídeos; em regiões codificantes podem alterar aminoácidos.<\/li>\n    <li><b>Germinativas:<\/b> passam para as próximas gerações; fonte de variabilidade para a evolução.<\/li>\n    <li><b>Somáticas:<\/b> ficam no indivíduo; associadas a câncer e doenças degenerativas.<\/li>\n    <li><b>Causas:<\/b> espontâneas (erros de replicação) ou induzidas por agentes físicos, químicos e biológicos.<\/li><\/ul>", "pq": "Por que uma mutação na pele não passa para os filhos, mas uma no óvulo pode passar?", "chave": "Mutação germinativa é herdável; somática fica no indivíduo. Podem ser espontâneas ou induzidas."}, {"e": "🛠️", "t": "Reparo, recombinação e transposons", "txt": "<ul><li><b>Reparo do DNA:<\/b> fotorreativação, excisão de bases, excisão de nucleotídeos e reparo por recombinação. Quando o dano supera a capacidade de reparo, a célula entra em <b>apoptose<\/b> (morte programada).<\/li>\n    <li><b>Recombinação homóloga:<\/b> ocorre na meiose, com quebra e reunião de cromossomos homólogos; gera variabilidade.<\/li>\n    <li><b>Transposons<\/b> (\"genes saltadores\"): sequências que mudam de lugar no genoma, propostas por <b>Barbara McClintock<\/b>.<\/li><\/ul>", "pq": "Por que uma célula \"prefere\" morrer (apoptose) a seguir com o DNA muito danificado?", "chave": "A célula repara lesões; se não consegue, entra em apoptose. Recombinação e transposons geram diversidade."}]}, {"id": "m3", "e": "🧠", "curto": "Neuro", "nome": "Neurociência do comportamento", "desc": "Lobos cerebrais, sistema límbico, neurotransmissores, hormônios e plasticidade.", "conceitos": [{"e": "🎯", "t": "Lobo frontal", "txt": "<p>O cérebro é o principal órgão do comportamento. O <b>lobo frontal<\/b> é chamado de \"sede\" da personalidade e das <b>funções executivas<\/b>:<\/p>\n    <ul><li>🗺️ planejamento e 🧭 tomada de decisão;<\/li>\n    <li>🧘 controle emocional e 🎯 atenção;<\/li>\n    <li>⚖️ julgamento e 🎭 personalidade.<\/li><\/ul>", "pq": "Que função executiva você mais usa ao estudar para uma prova?", "chave": "Lobo frontal = funções executivas: planejar, decidir, controlar emoções, focar e julgar."}, {"e": "🗺️", "t": "Lobos parietal, temporal e occipital", "txt": "<div class=\"scroll\"><table class=\"tb\"><tr><th>Lobo<\/th><th>Funções<\/th><\/tr>\n    <tr><td>✋ Parietal<\/td><td>Informações sensoriais e espaciais: toque, dor, temperatura, orientação no espaço<\/td><\/tr>\n    <tr><td>👂 Temporal<\/td><td>Audição, reconhecimento da fala, memória e linguagem<\/td><\/tr>\n    <tr><td>👁️ Occipital<\/td><td>Visão: objetos, rostos, cores, profundidade e movimento<\/td><\/tr><\/table><\/div>", "pq": "Associe cada lobo a uma parte do corpo: mão, ouvido, olho. Em que ordem?", "chave": "Parietal = sensação e espaço; temporal = audição, memória e linguagem; occipital = visão."}, {"e": "❤️", "t": "Sistema límbico", "txt": "<p>O \"centro emocional\": regula emoção, memória, motivação e comportamento.<\/p>\n    <ul><li><b>🌰 Amígdala:<\/b> processa e memoriza reações emocionais: medo (luta ou fuga), ansiedade, agressividade e valência emocional dos estímulos.<\/li>\n    <li><b>🐴 Hipocampo:<\/b> formação de novas memórias e navegação espacial; liga emoções a eventos junto com a amígdala.<\/li>\n    <li><b>🌡️ Hipotálamo:<\/b> regula temperatura, fome, sede, sono e hormônios; elo entre sistema nervoso e endócrino.<\/li><\/ul>", "pq": "Por que lembramos com mais nitidez de eventos emocionalmente fortes?", "chave": "Amígdala = emoção e medo; hipocampo = memória; hipotálamo = funções vitais e hormônios."}, {"e": "⚡", "t": "Dopamina", "txt": "<p>Neurotransmissores são mensageiros químicos que passam sinais entre neurônios pelas <b>sinapses<\/b>.<\/p>\n    <p>A <b>dopamina<\/b> participa de:<\/p>\n    <ul><li>🎯 <b>motivação<\/b> (busca por objetivos);<\/li><li>🎁 <b>prazer e recompensa<\/b>;<\/li><li>🏃 <b>movimento<\/b> e coordenação motora.<\/li><\/ul>\n    <p>Alterações estão associadas a <b>TDAH<\/b>, <b>doença de Parkinson<\/b> e <b>esquizofrenia<\/b>.<\/p>\n    <p class=\"small muted\">Nota: o slide a chama de \"hormônio do bem-estar\", um apelido popular. No cérebro, a dopamina atua como neurotransmissor, e seu papel central é mais a motivação e a previsão de recompensa do que o prazer em si.<\/p>", "pq": "Como a mesma molécula pode estar ligada a Parkinson (movimento) e a TDAH (atenção)?", "chave": "Dopamina = motivação, recompensa e movimento; ligada a TDAH, Parkinson e esquizofrenia."}, {"e": "🌙", "t": "Serotonina", "txt": "<p>A <b>serotonina<\/b> modula:<\/p>\n    <ul><li>😌 <b>humor<\/b>; 😴 <b>sono<\/b> (é precursora da melatonina); 🍽️ <b>apetite<\/b> e saciedade; 🌿 bem-estar e estabilidade emocional.<\/li><\/ul>\n    <p>O slide associa baixos níveis de serotonina a depressão, ansiedade e problemas de controle de impulsos.<\/p>\n    <p class=\"small muted\">Nota: \"hormônio da felicidade\" é um apelido popular. Revisões recentes mostram que a depressão não se explica simplesmente por \"falta de serotonina\": envolve múltiplos sistemas, circuitos e fatores ambientais.<\/p>", "pq": "Por que é simplista dizer que alguém \"está deprimido por falta de serotonina\"?", "chave": "Serotonina = humor, sono, apetite e bem-estar; a depressão é multifatorial."}, {"e": "🎻", "t": "Sistema endócrino: cortisol, adrenalina e ocitocina", "txt": "<p>Glândulas liberam <b>hormônios<\/b> na corrente sanguínea, atuando em sincronia com o sistema nervoso.<\/p>\n    <div class=\"scroll\"><table class=\"tb\"><tr><th>Hormônio<\/th><th>Funções<\/th><\/tr>\n    <tr><td>😰 Cortisol<\/td><td>Hormônio do estresse: mobiliza energia, regula açúcar no sangue e gorduras, modula o sistema imune<\/td><\/tr>\n    <tr><td>⚡ Adrenalina<\/td><td>Reação de luta ou fuga: acelera o coração, eleva a pressão, aumenta o alerta<\/td><\/tr>\n    <tr><td>🤝 Ocitocina<\/td><td>Vínculos: apego social, empatia, confiança, relações afetivas e parentais<\/td><\/tr><\/table><\/div>\n    <p class=\"small muted\">Complemento: o cortisol é liberado pelo <b>eixo HPA<\/b> (hipotálamo → hipófise → glândulas adrenais), o principal sistema de resposta ao estresse.<\/p>", "pq": "Num exame importante, que hormônios entram em ação e o que você sente no corpo?", "chave": "Cortisol = estresse; adrenalina = luta ou fuga; ocitocina = vínculo e confiança."}, {"e": "🌿", "t": "Plasticidade cerebral", "txt": "<p>O cérebro é um órgão <b>dinâmico<\/b> que se adapta e se remodela por toda a vida em resposta a informações, desafios e lesões.<\/p>\n    <ul><li>📚 <b>Aprendizado:<\/b> novas habilidades reestruturam conexões.<\/li>\n    <li>🌍 <b>Experiências:<\/b> vivências moldam arquitetura e função.<\/li>\n    <li>🛋️ <b>Psicoterapia:<\/b> cria novos caminhos neurais para padrões mais saudáveis.<\/li>\n    <li>🩹 <b>Reabilitação:<\/b> após lesões, o cérebro se reorganiza.<\/li>\n    <li>🔁 <b>Hábitos:<\/b> a repetição fortalece conexões e automatiza comportamentos.<\/li><\/ul>", "pq": "Como a plasticidade justifica que a psicoterapia \"muda o cérebro\"?", "chave": "O cérebro aprende e se transforma a vida toda: capacidades não são fixas após a infância."}]}, {"id": "m4", "e": "🌱", "curto": "Genes×Amb.", "nome": "Genes e Ambiente", "desc": "Genética comportamental: herdabilidade, gêmeos, epigenética e interação gene-ambiente.", "conceitos": [{"e": "🧩", "t": "O que é comportamento humano", "txt": "<p>Comportamento é o conjunto de <b>ações, pensamentos, emoções e respostas<\/b> de um indivíduo diante do ambiente.<\/p>\n    <p>Resulta da interação entre: 🧬 genética, 🧠 sistema nervoso, ❤️ emoções, 🌍 ambiente e 🎎 cultura.<\/p>\n    <p>A genética comportamental estuda como diferenças genéticas e ambientais contribuem para diferenças entre pessoas em temperamento, inteligência, personalidade (Big Five), capacidades cognitivas e risco de transtornos.<\/p>", "pq": "Escolha um comportamento seu e liste um fator de cada tipo que influencia nele.", "chave": "Comportamento é multideterminado: genes, cérebro, emoções, ambiente e cultura."}, {"e": "⚖️", "t": "Natureza × criação: o consenso atual", "txt": "<ul><li><b>🧬 Natureza:<\/b> fatores genéticos influenciam comportamento e predisposições.<\/li>\n    <li><b>🌱 Criação:<\/b> ambiente e experiências moldam a psicologia ao longo do desenvolvimento.<\/li>\n    <li><b>🔄 Consenso:<\/b> a <b>interação gene-ambiente<\/b> é fundamental. Nem um, nem outro isoladamente.<\/li><\/ul>\n    <p>Os genes dão uma predisposição, um \"plano\"; o ambiente influencia quais partes desse plano são lidas e como se manifestam. Uma predisposição genética à ansiedade <b>não garante<\/b> o transtorno.<\/p>\n    <p class=\"key\">\"Não somos nem escravos do nosso código genético, nem tábulas rasas.\"<\/p>", "pq": "Por que a pergunta \"é genético ou ambiental?\" é mal formulada?", "chave": "Genes e ambiente interagem continuamente; a pergunta certa é \"como interagem?\"."}, {"e": "📊", "t": "Herdabilidade", "txt": "<p><b>Herdabilidade<\/b> é a proporção da <b>variação<\/b> de um traço, numa <b>população específica e num contexto específico<\/b>, atribuída a diferenças genéticas. Vai de 0 a 1 (ou 0% a 100%).<\/p>\n    <ul><li>❌ Herdabilidade de 0,70 <b>não<\/b> significa que \"70% do comportamento de cada pessoa é genético\".<\/li>\n    <li>✅ Significa que, naquela população, 70% das <b>diferenças entre as pessoas<\/b> estão associadas a diferenças genéticas.<\/li>\n    <li>Ela <b>muda<\/b> se o ambiente ou a população mudar.<\/li>\n    <li>Herdabilidade alta <b>não é determinismo<\/b> nem impede mudanças pelo ambiente.<\/li><\/ul>", "pq": "Se todos recebessem exatamente a mesma educação, a herdabilidade do desempenho escolar subiria ou cairia? Por quê?", "chave": "Herdabilidade descreve variação em populações, não a \"porcentagem genética\" de um indivíduo."}, {"e": "👯", "t": "Estudos de gêmeos, adoção e família", "txt": "<ul><li><b>Gêmeos monozigóticos (MZ):<\/b> vêm do mesmo óvulo; compartilham praticamente 100% do DNA.<\/li>\n    <li><b>Dizigóticos (DZ):<\/b> dois óvulos diferentes; compartilham em média 50% das variantes, como irmãos comuns.<\/li>\n    <li>Se a <b>concordância<\/b> de um traço é maior entre MZ do que entre DZ, há indício de influência genética.<\/li>\n    <li><b>Estudos de adoção<\/b> comparam o filho com os pais biológicos (genes) e os adotivos (ambiente).<\/li><\/ul>\n    <p><b>Por que MZ não são 100% iguais?<\/b> Diferenças ambientais, <b>epigenéticas<\/b>, de <b>desenvolvimento<\/b> (ex.: posição no útero) e <b>estocásticas<\/b> (acaso biológico), além de raras mutações após a fecundação.<\/p>\n    <p class=\"small muted\">Complemento: uma estimativa clássica (fórmula de Falconer) é h² ≈ 2 × (correlação MZ − correlação DZ).<\/p>", "pq": "Gêmeos idênticos com concordância de 50% para um transtorno: o que isso diz sobre genes e ambiente?", "chave": "MZ × DZ revela influência genética; diferenças entre MZ não são só \"ambiente\": há epigenética, desenvolvimento e acaso."}, {"e": "🏠", "t": "Agregação familiar ≠ genética", "txt": "<p>Se uma condição aparece muito em uma família, isso <b>não prova<\/b> que ela seja genética. Famílias compartilham:<\/p>\n    <ul><li>🧬 genes;<\/li><li>🏠 ambiente (casa, renda, alimentação, estresse);<\/li><li>🎎 cultura, hábitos e modos de lidar com emoções.<\/li><\/ul>\n    <p>Por isso usamos gêmeos e adoção para separar as influências. Traços <b>complexos<\/b> envolvem múltiplos genes, fatores ambientais e diferentes níveis de expressão, e por isso membros da mesma família podem manifestá-los de formas distintas.<\/p>", "pq": "Uma família de músicos prova que talento musical é genético?", "chave": "O que é familiar pode ser genético, ambiental, cultural ou, mais comumente, tudo junto."}, {"e": "🎲", "t": "Poligenia: associação não é determinação", "txt": "<ul><li>Traços psicológicos são <b>poligênicos<\/b>: muitos genes de pequeno efeito, não um \"gene da impulsividade\".<\/li>\n    <li>Uma variante pode ser <b>estatisticamente associada<\/b> a um comportamento e mesmo assim aparecer em pessoas que não o apresentam.<\/li>\n    <li>Isso indica <b>influência ou vulnerabilidade<\/b>, não determinação; não permite prever o comportamento de cada indivíduo.<\/li>\n    <li>Herança <b>mendeliana simples<\/b> (um gene, proporções previsíveis) é exceção para traços psicológicos.<\/li><\/ul>", "pq": "Por que não existe \"o gene\" da depressão?", "chave": "Genes aumentam probabilidades; não ditam destinos. Associação ≠ causa determinante."}, {"e": "🏷️", "t": "Epigenética", "txt": "<p>Estuda como fatores ambientais e comportamentais modificam a <b>expressão dos genes sem alterar a sequência do DNA<\/b>, \"ligando\" ou \"desligando\" genes (ex.: metilação do DNA).<\/p>\n    <p><b>Fatores que influenciam:<\/b> 🍎 alimentação, 😰 estresse, 🏃 exercício físico, 💔 trauma, 🤗 afeto e cuidado parental, 🏠 ambiente familiar.<\/p>\n    <p>Crianças expostas a negligência ou violência podem apresentar alterações na expressão de genes da resposta ao estresse, aumentando riscos emocionais ao longo da vida.<\/p>\n    <p class=\"small muted\">Cautela: o slide diz que marcas de trauma \"podem ser herdadas\". Isso está demonstrado em animais; em humanos, a herança epigenética entre gerações ainda é debatida.<\/p>", "pq": "Como a epigenética derruba a ideia de que \"ambiente é só algo externo\"?", "chave": "Epigenética: o ambiente muda a expressão dos genes sem mudar o DNA."}, {"e": "🔄", "t": "Interação e correlação gene-ambiente", "txt": "<p><b>Interação gene × ambiente:<\/b> o efeito de um gene depende do ambiente (e vice-versa). Ex.: Caspi e colaboradores (2003) relataram que uma variante do gene do transportador de serotonina aumentava o risco de depressão apenas em quem vivia muitos eventos estressantes.<\/p>\n    <p class=\"small muted\">Estudos posteriores maiores tiveram resultados inconsistentes para esse gene específico, mas a ideia de interação continua central.<\/p>\n    <p><b>Correlação gene-ambiente<\/b> (complemento):<\/p>\n    <ul><li><b>Passiva:<\/b> pais fornecem genes e o ambiente (pais leitores, casa com livros).<\/li>\n    <li><b>Evocativa:<\/b> traços da criança provocam respostas do ambiente (bebê sorridente recebe mais interação).<\/li>\n    <li><b>Ativa:<\/b> a pessoa busca ambientes compatíveis com suas predisposições.<\/li><\/ul>", "pq": "Dê um exemplo pessoal de correlação gene-ambiente ativa.", "chave": "Genes influenciam como reagimos ao ambiente e quais ambientes encontramos e escolhemos."}, {"e": "⚠️", "t": "Diferenças entre grupos e determinismo", "txt": "<p>Diferenças de desempenho entre grupos que vivem em condições diferentes (recursos educacionais, alimentação, vulnerabilidade socioeconômica) <b>não<\/b> podem ser lidas como prova de \"superioridade genética\".<\/p>\n    <p class=\"small muted\">Complemento: Richard Lewontin usou a analogia de sementes. Das mesmas sementes, metade é plantada em solo rico e metade em solo pobre. Dentro de cada vaso, as diferenças podem ser genéticas, mas a diferença <b>entre os vasos<\/b> é inteiramente ambiental.<\/p>\n    <p>Também não se deve ler <b>genótipo → expressão → desenvolvimento → ambiente → fenótipo<\/b> como sequência rígida: o ambiente modifica trajetórias de desenvolvimento a todo momento.<\/p>", "pq": "Por que a herdabilidade dentro de um grupo não explica diferenças entre grupos?", "chave": "Diferenças entre grupos em ambientes desiguais não demonstram diferenças genéticas."}, {"e": "🔺", "t": "Modelo biopsicossocial integrado", "txt": "<ul><li><b>🧬 Biológica:<\/b> genes, cérebro, neurotransmissores, hormônios: predisposições e base física.<\/li>\n    <li><b>💭 Psicológica:<\/b> emoções, cognição, personalidade, aprendizagem: modulam percepção e resposta.<\/li>\n    <li><b>👥 Social:<\/b> família, cultura, educação, ambiente e relações: contextos que moldam e são moldados.<\/li><\/ul>\n    <p>Nenhum fator isolado explica a complexidade do comportamento humano.<\/p>", "pq": "Explique a ansiedade de uma estudante nas três dimensões.", "chave": "Biologia, psicologia e sociedade são lentes complementares do mesmo comportamento."}]}, {"id": "m5", "e": "🩺", "curto": "Transtornos", "nome": "Hereditariedade em transtornos", "desc": "Herdabilidade de cada transtorno, diátese-estresse e implicações clínicas e éticas.", "conceitos": [{"e": "📊", "t": "Herdabilidade estimada por transtorno", "txt": "<p>Valores aproximados apresentados em aula:<\/p>\n    <div class=\"hrow\"><span>TEA<\/span><span class=\"bar\"><i style=\"width:80%\"><\/i><\/span><b>~80%<\/b><\/div>\n    <div class=\"hrow\"><span>Bipolar<\/span><span class=\"bar\"><i style=\"width:70%\"><\/i><\/span><b>~70%<\/b><\/div>\n    <div class=\"hrow\"><span>Esquizofrenia<\/span><span class=\"bar\"><i style=\"width:70%\"><\/i><\/span><b>~70%<\/b><\/div>\n    <div class=\"hrow\"><span>Depressão maior<\/span><span class=\"bar\"><i style=\"width:35%\"><\/i><\/span><b>~35%<\/b><\/div>\n    <div class=\"hrow\"><span>Ansiedade<\/span><span class=\"bar\"><i style=\"width:30%\"><\/i><\/span><b>~30%<\/b><\/div>\n    <p class=\"key\">Herdabilidade descreve populações, não indivíduos. Um gene não \"causa\" um transtorno: ele aumenta a probabilidade.<\/p>", "pq": "Ordene os transtornos da maior para a menor herdabilidade sem olhar.", "chave": "TEA > bipolar ≈ esquizofrenia > depressão > ansiedade."}, {"e": "🌧️", "t": "Depressão e ansiedade", "txt": "<p><b>Transtorno depressivo maior (herdabilidade 30–40%)<\/b><\/p>\n    <ul><li>Variantes genéticas afetam o sistema serotoninérgico e a resposta ao estresse.<\/li>\n    <li>Trauma, perda e adversidade <b>ativam<\/b> a predisposição latente.<\/li>\n    <li>Com 60–70% da variância ligada ao ambiente, é um dos transtornos mais influenciados pelo contexto de vida.<\/li><\/ul>\n    <p><b>Transtornos de ansiedade (herdabilidade 25–35%)<\/b><\/p>\n    <ul><li>Variam por subtipo (fobia específica, TAG, pânico).<\/li>\n    <li>Herda-se um <b>temperamento ansioso<\/b>: alta reatividade ao medo e inibição comportamental.<\/li>\n    <li>Predispostos mostram <b>amígdala mais reativa<\/b> a ameaças.<\/li><\/ul>", "pq": "Por que dizer que a depressão é \"60–70% ambiental\" é uma boa notícia para a psicoterapia?", "chave": "Depressão e ansiedade têm herdabilidade moderada e grande peso ambiental."}, {"e": "🔁", "t": "Bipolar e esquizofrenia", "txt": "<p><b>Herdabilidade: 60–80%<\/b><\/p>\n    <ul><li><b>Bipolar:<\/b> risco cerca de 10 vezes maior em filhos de pais com o transtorno; múltiplos genes, não existe um único \"gene do bipolar\".<\/li>\n    <li><b>Esquizofrenia:<\/b> risco de cerca de 10% com um progenitor afetado e cerca de 45% quando ambos têm o diagnóstico; genes afetam o sistema dopaminérgico e o desenvolvimento cerebral pré-natal.<\/li><\/ul>", "pq": "Se o risco com os dois pais afetados é 45%, por que mais da metade dos filhos não desenvolve o transtorno?", "chave": "Alta herdabilidade ainda é probabilidade: risco aumentado não é destino."}, {"e": "🧩", "t": "Transtorno do Espectro Autista (TEA)", "txt": "<ul><li><b>Herdabilidade de 70–90%<\/b>: um dos transtornos mais influenciados geneticamente, segundo estudos com gêmeos.<\/li>\n    <li><b>Poligenia:<\/b> muitos genes de pequeno efeito interagem; não há um único gene causal, mas variação genética acumulada.<\/li>\n    <li><b>Ambiente pré-natal:<\/b> infecções na gestação e exposição a certas substâncias influenciam a expressão gênica no desenvolvimento fetal.<\/li><\/ul>", "pq": "Como alta herdabilidade convive com a ideia de neurodiversidade?", "chave": "TEA: alta herdabilidade, poligênico, com influência do ambiente pré-natal."}, {"e": "⚖️", "t": "Modelo diátese-estresse", "txt": "<div class=\"flow\"><span>🧬 <b>Diátese:<\/b> predisposição genética herdada; vulnerabilidade biológica latente<\/span><i>➕<\/i>\n    <span>🌩️ <b>Estresse:<\/b> gatilhos ambientais (trauma, perda, adversidade crônica, estresse agudo)<\/span><i>▼<\/i>\n    <span>🩺 <b>Transtorno:<\/b> emerge quando os dois se combinam acima do limiar individual de vulnerabilidade<\/span><\/div>\n    <p>Nenhum dos dois fatores, isolado, é suficiente.<\/p>", "pq": "Duas pessoas sofrem a mesma perda e só uma desenvolve depressão. Explique com o modelo.", "chave": "Diátese (vulnerabilidade) + estresse (gatilho) acima de um limiar = transtorno."}, {"e": "🏥", "t": "Aplicações da biologia na Psicologia", "txt": "<div class=\"scroll\"><table class=\"tb\"><tr><th>Condição<\/th><th>Foco de investigação<\/th><\/tr>\n    <tr><td>Ansiedade<\/td><td>Neurotransmissores e atividade da amígdala<\/td><\/tr>\n    <tr><td>Depressão<\/td><td>Circuitos neurais e genes de resposta ao estresse e humor<\/td><\/tr>\n    <tr><td>TDAH<\/td><td>Córtex pré-frontal; dopamina e noradrenalina<\/td><\/tr>\n    <tr><td>TEA<\/td><td>Fatores genéticos e neurobiológicos do desenvolvimento cerebral<\/td><\/tr>\n    <tr><td>Esquizofrenia<\/td><td>Alterações estruturais e funcionais; vários neurotransmissores<\/td><\/tr>\n    <tr><td>Dependência química<\/td><td>Circuitos de recompensa e vulnerabilidade genética<\/td><\/tr><\/table><\/div>", "pq": "Que região ou substância aparece em mais de uma linha da tabela?", "chave": "Conhecer bases neurobiológicas ajuda no diagnóstico, tratamento e prevenção."}, {"e": "🛡️", "t": "Implicações clínicas e éticas", "txt": "<ul><li><b>Diagnóstico:<\/b> a história familiar é um fator de risco relevante e integra a avaliação psicológica.<\/li>\n    <li><b>Tratamento:<\/b> medicação e psicoterapia juntas costumam ser mais eficazes porque atuam no biológico, no ambiental e no cognitivo.<\/li>\n    <li><b>Ética:<\/b> evitar o <b>determinismo genético<\/b>; o <b>estigma genético<\/b> é um risco real.<\/li><\/ul>\n    <p class=\"key\">Hereditariedade importa, mas não determina. Predisposição não é diagnóstico.<\/p>", "pq": "Como você explicaria a um paciente que tem \"um pai com esquizofrenia\" o que isso significa para ele?", "chave": "Genes aumentam probabilidades, não ditam destinos; cuidado com estigma e determinismo."}]}, {"id": "m6", "e": "🦴", "curto": "Evolução", "nome": "Evolução e comportamento", "desc": "Seleção natural, comportamentos selecionados e os cuidados da Psicologia Evolucionista.", "conceitos": [{"e": "🤝", "t": "Comportamentos favorecidos pela evolução", "txt": "<p>O comportamento humano também reflete processos evolutivos. Alguns comportamentos favoreceram sobrevivência e reprodução:<\/p>\n    <ul><li>🤝 <b>Cooperação:<\/b> caça, defesa e abrigo em grupo.<\/li>\n    <li>🫂 <b>Formação de vínculos:<\/b> apoio mútuo e coesão.<\/li>\n    <li>👶 <b>Proteção dos filhos:<\/b> investimento parental prolongado.<\/li>\n    <li>🗣️ <b>Comunicação:<\/b> linguagem para coordenação e transmissão de saberes.<\/li>\n    <li>🪞 <b>Aprendizagem social:<\/b> imitar e transmitir cultura acelerou a adaptação.<\/li><\/ul>", "pq": "Qual desses cinco comportamentos você mais vê nas redes sociais hoje?", "chave": "Cooperação, vínculo, cuidado parental, comunicação e aprendizagem social tiveram valor adaptativo."}, {"e": "🌿", "t": "Como funciona a seleção natural", "txt": "<p>Proposta por Darwin (1859), a seleção natural precisa de três condições ao mesmo tempo:<\/p>\n    <div class=\"flow\"><span>1️⃣ <b>Variação<\/b> entre indivíduos<\/span><i>▼<\/i>\n    <span>2️⃣ Variação <b>herdável<\/b> (transmitida aos descendentes)<\/span><i>▼<\/i>\n    <span>3️⃣ Diferenças no <b>sucesso reprodutivo<\/b> ligadas a essa variação<\/span><\/div>\n    <p>⚠️ Aumentar a sobrevivência <b>não basta<\/b>: se a característica não for herdável ou não aumentar a reprodução, ela não é selecionada.<\/p>", "pq": "Um comportamento que aumenta a sobrevivência mas reduz o número de filhos seria selecionado?", "chave": "Seleção natural = variação herdável + sucesso reprodutivo diferencial + transmissão."}, {"e": "🍩", "t": "Psicologia Evolucionista e o descompasso moderno", "txt": "<p>A Psicologia Evolucionista investiga relações entre <b>mecanismos psicológicos<\/b> e <b>problemas adaptativos<\/b> de populações ancestrais.<\/p>\n    <p>Mas uma explicação evolucionista <b>não<\/b> significa que todo comportamento atual seja adaptativo: mecanismos moldados em ambientes ancestrais podem produzir respostas diferentes em ambientes modernos.<\/p>\n    <p class=\"small muted\">Complemento: esse \"descompasso\" (<i>mismatch<\/i>) explica, por exemplo, a preferência por açúcar e gordura, vantajosa na escassez e problemática na abundância de hoje.<\/p>", "pq": "Que reação de medo sua faz sentido \"na savana\" mas exagera no mundo atual?", "chave": "Mecanismos antigos + ambientes novos = respostas que podem não ser mais adaptativas."}, {"e": "🔍", "t": "Cuidados metodológicos", "txt": "<ul><li><b>Universal ≠ selecionado:<\/b> encontrar uma característica em várias culturas, por si só, não prova seleção natural. Ela pode vir de aprendizagem semelhante, de condições comuns de vida ou ser subproduto de outra característica.<\/li>\n    <li><b>Evitar determinismo:<\/b> predisposições biológicas interagem com desenvolvimento, aprendizagem e contexto.<\/li>\n    <li><b>Cultura importa:<\/b> a influência evolutiva não torna desnecessário estudar fatores sociais e culturais.<\/li><\/ul>\n    <p class=\"small muted\">Complemento: a \"falácia naturalista\" é concluir que algo é bom ou correto só porque é natural ou evoluiu.<\/p>", "pq": "Que outra explicação (não evolutiva) poderia justificar um traço encontrado em todas as culturas?", "chave": "Evolução explica predisposições, não destinos; universalidade não basta como prova de adaptação."}, {"e": "🔭", "t": "Uma visão integrada", "txt": "<p>Genética comportamental e Psicologia Evolucionista convergem: características psicológicas resultam de interações entre <b>predisposições biológicas, desenvolvimento, aprendizagem e contexto<\/b>.<\/p>\n    <p class=\"key\">\"A biologia e a psicologia não são disciplinas separadas, mas lentes complementares que revelam a complexidade da mente humana.\"<\/p>", "pq": "Resuma a disciplina inteira numa frase sua.", "chave": "Biologia oferece possibilidades; o ambiente, o desenvolvimento e a cultura decidem como elas se realizam."}]}, {"id": "m7", "e": "🧪", "curto": "Epigenética", "nome": "Epigenética na Psicologia", "desc": "Mecanismos moleculares (metilação, histonas, RNAs não codificantes), estresse e eixo HPA, memória, psicopatologia, intervenções, métodos, limites e ética.", "conceitos": [{"e": "🔁", "t": "Do determinismo linear ao modelo recíproco", "txt": "<div class=\"scroll\"><table class=\"tb\"><tr><th>Modelo clássico linear<\/th><th>Modelo epigenético recíproco<\/th><\/tr>\n    <tr><td>DNA → RNA → proteína → fenótipo, como um código que se executa sozinho<\/td><td>A experiência (cuidado, estresse, aprendizagem) <b>modula a atividade dos genes<\/b> sem alterar a sequência de nucleotídeos<\/td><\/tr><\/table><\/div>\n    <ul><li><b>Epigenética<\/b>: mudanças <b>estáveis, mas potencialmente reversíveis<\/b>, na expressão gênica, que não alteram a sequência do DNA.<\/li>\n    <li>Os principais mecanismos são três: <b>metilação do DNA<\/b>, <b>modificações de histonas<\/b> e <b>RNAs não codificantes<\/b>.<\/li><\/ul>\n    <p class=\"key\">O genoma não é um \"roteiro fixo\": é uma partitura que o ambiente ajuda a tocar.<\/p>\n    <p class=\"small muted\">🔗 Aprofunda o conceito \"Epigenética\" do módulo 4 (Genes e Ambiente) e o fluxo da informação do módulo 2 (Genética Molecular).<\/p>\n    <p class=\"small muted\">📄 Meaney (2010); Nestler et al. (2016).<\/p>", "pq": "Explique com suas palavras a diferença entre mudar o DNA e mudar a expressão do DNA.", "chave": "Epigenética = ambiente regula a expressão gênica sem mudar a sequência do DNA."}, {"e": "🧶", "t": "Cromatina: eucromatina e heterocromatina", "txt": "<p>No núcleo, o DNA se enrola em proteínas chamadas <b>histonas<\/b>, formando <b>nucleossomos<\/b>. O conjunto DNA + histonas é a <b>cromatina<\/b>.<\/p>\n    <div class=\"scroll\"><table class=\"tb\"><tr><th>Eucromatina<\/th><th>Heterocromatina<\/th><\/tr>\n    <tr><td>Mais <b>descondensada<\/b> (\"aberta\")<\/td><td>Mais <b>compactada<\/b> (\"fechada\")<\/td><\/tr>\n    <tr><td>Acessível aos fatores de transcrição<\/td><td>Dificulta o acesso das enzimas<\/td><\/tr>\n    <tr><td>Genes tendem a estar <b>ativos<\/b><\/td><td>Genes tendem a ser <b>silenciados<\/b><\/td><\/tr><\/table><\/div>\n    <p class=\"key\">A epigenética trabalha, em grande parte, abrindo ou fechando a cromatina: decide se um gene está \"disponível para leitura\".<\/p>\n    <p class=\"small muted\">📄 Alberts et al., Biologia Molecular da Célula; Nestler et al. (2016).<\/p>", "pq": "Use a metáfora de um livro: o que seria a eucromatina e a heterocromatina?", "chave": "Cromatina aberta (eucromatina) favorece a transcrição; fechada (heterocromatina) silencia."}, {"e": "🏷️", "t": "Metilação do DNA e ilhas CpG", "txt": "<ul><li><b>Metilação<\/b>: adição de um grupo metil à citosina, sobretudo em sítios <b>CpG<\/b> (citosina seguida de guanina). Regiões ricas em CpG perto dos promotores são as <b>ilhas CpG<\/b>.<\/li>\n    <li>Metilação no <b>promotor<\/b> costuma <b>reduzir<\/b> a transcrição do gene.<\/li>\n    <li><b>DNMT1<\/b>: mantém o padrão de metilação quando a célula se divide (metilação de manutenção).<\/li>\n    <li><b>DNMT3a / DNMT3b<\/b>: fazem metilação <b>de novo<\/b>; no cérebro, participam de mudanças ligadas à atividade neuronal e à aprendizagem.<\/li>\n    <li><b>MeCP2<\/b>: proteína que se liga a CpGs metilados e recruta complexos que silenciam a cromatina. Mutações no gene <i>MECP2<\/i> causam a <b>síndrome de Rett<\/b>.<\/li>\n    <li>O doador de grupos metil é a <b>SAM<\/b> (S-adenosilmetionina), que depende de nutrientes como folato e vitamina B12.<\/li><\/ul>\n    <p class=\"key\">Metilação não é \"liga/desliga\" absoluto: o efeito depende de onde ela ocorre no gene e do tipo de célula.<\/p>\n    <p class=\"small muted\">📄 Moore, Le e Fan (2013); Day e Sweatt (2010).<\/p>", "pq": "Por que é importante que a DNMT1 \"copie\" a metilação na divisão celular?", "chave": "Metilação em CpG (DNMT1 mantém, DNMT3a/b criam); MeCP2 lê a metilação e silencia."}, {"e": "🧵", "t": "Código das histonas", "txt": "<p>As \"caudas\" das histonas recebem marcas químicas que mudam a compactação da cromatina:<\/p>\n    <div class=\"scroll\"><table class=\"tb\"><tr><th>Marca<\/th><th>Enzimas<\/th><th>Efeito típico<\/th><\/tr>\n    <tr><td>🟢 <b>Acetilação<\/b><\/td><td><b>HATs<\/b> colocam; <b>HDACs<\/b> retiram<\/td><td>Neutraliza cargas positivas, afrouxa a ligação com o DNA e <b>favorece a transcrição<\/b><\/td><\/tr>\n    <tr><td>🔵 <b>Metilação de histonas<\/b><\/td><td>Metiltransferases e desmetilases<\/td><td>Depende do resíduo e do grau: <b>H3K4me3<\/b> está ligada a genes ativos; <b>H3K27me3<\/b> e <b>H3K9me3<\/b>, a genes reprimidos<\/td><\/tr><\/table><\/div>\n    <p class=\"key\">Os inibidores de HDAC (que mantêm a acetilação) são uma linha importante de pesquisa em memória e em psiquiatria.<\/p>\n    <p class=\"small muted\">📄 Tsankova et al. (2007); Nestler et al. (2016).<\/p>", "pq": "Se uma droga bloqueia as HDACs, o que acontece com a acetilação e com a transcrição?", "chave": "Acetilação (HAT) abre e ativa; HDAC retira; metilação de histona ativa ou reprime conforme o resíduo."}, {"e": "✂️", "t": "RNAs não codificantes", "txt": "<ul><li>Parte do RNA produzido <b>não vira proteína<\/b>, mas regula outros genes.<\/li>\n    <li><b>microRNAs (miRNAs)<\/b>: pequenos RNAs que se ligam ao RNA mensageiro e levam à sua <b>degradação<\/b> ou <b>bloqueiam a tradução<\/b>. Nos neurônios, alguns atuam localmente perto das sinapses, regulando a plasticidade.<\/li>\n    <li><b>lncRNAs<\/b> (RNAs longos não codificantes): funcionam como \"andaimes\" no núcleo e recrutam complexos que remodelam a cromatina.<\/li><\/ul>\n    <p class=\"key\">Regulação pós-transcricional: o gene foi lido, mas o miRNA decide se a mensagem vira proteína.<\/p>\n    <p class=\"small muted\">📄 Nestler et al. (2016).<\/p>", "pq": "Qual a diferença entre impedir a transcrição (metilação) e impedir a tradução (miRNA)?", "chave": "miRNAs degradam ou bloqueiam o mRNA; lncRNAs organizam a cromatina."}, {"e": "🐀", "t": "Estudo clássico: cuidado materno (Weaver et al., 2004)", "txt": "<p>Estudo do laboratório de <b>Michael Meaney<\/b> com ratos, publicado por <b>Weaver et al. (2004)<\/b>. O cuidado materno foi medido pela frequência de <b>lamber e limpar<\/b> os filhotes e de <b>amamentar em postura arqueada<\/b> (LG-ABN, na sigla em inglês).<\/p>\n    <div class=\"scroll\"><table class=\"tb\"><tr><th>Alto cuidado (alto LG-ABN)<\/th><th>Baixo cuidado (baixo LG-ABN)<\/th><\/tr>\n    <tr><td><b>Menos metilação<\/b> no promotor do gene do receptor de glicocorticoide (<i>Nr3c1<\/i>) no hipocampo<\/td><td><b>Mais metilação<\/b> nesse promotor<\/td><\/tr>\n    <tr><td>Mais receptores GR → freio eficiente do eixo do estresse<\/td><td>Menos GR → resposta ao estresse mais intensa e prolongada<\/td><\/tr><\/table><\/div>\n    <ul><li><b>Adoção cruzada<\/b>: filhotes de mães de baixo cuidado criados por mães de alto cuidado ficaram com o perfil do alto cuidado. O efeito veio do <b>cuidado recebido<\/b>, não da linhagem.<\/li>\n    <li>Um inibidor de HDAC (tricostatina A) <b>reverteu<\/b> parte das marcas na vida adulta: a programação é estável, mas não é imutável.<\/li><\/ul>\n    <p class=\"key\">Primeira demonstração forte de que o cuidado nos primeiros dias \"escreve\" marcas epigenéticas que mudam a resposta ao estresse.<\/p>\n    <p class=\"small muted\">Nota: o slide atribui o estudo a \"Meaney, 2004\" e repete a sigla \"LG-AB\" nas duas condições. O artigo é de Weaver et al. (2004), com Meaney como autor sênior; as condições são alto e baixo LG-ABN.<\/p>\n    <p class=\"small muted\">📄 Weaver, I. C. G. et al. (2004). <i>Nature Neuroscience<\/i>, 7, 847-854.<\/p>", "pq": "Por que a adoção cruzada é decisiva para concluir que o efeito é do cuidado e não dos genes?", "chave": "Mais cuidado → menos metilação de Nr3c1 → mais GR → melhor regulação do estresse."}, {"e": "⚙️", "t": "Programação epigenética do eixo HPA", "txt": "<ul><li><b>Eixo HPA<\/b>: hipotálamo → hipófise → adrenal → cortisol (corticosterona em roedores).<\/li>\n    <li>Os <b>receptores de glicocorticoide (GR)<\/b> no hipocampo fazem o <b>feedback negativo<\/b>: avisam que há cortisol suficiente e ajudam a encerrar a resposta.<\/li>\n    <li>No estudo de Weaver, o cuidado aumenta a ligação do fator de transcrição <b>NGFI-A<\/b> ao promotor do GR. A metilação nessa região <b>dificulta<\/b> essa ligação.<\/li>\n    <li>Com menos GR, o freio falha: a resposta ao estresse demora a terminar.<\/li>\n    <li>Em humanos, McGowan et al. (2009) encontraram mais metilação do promotor do GR (<i>NR3C1<\/i>) no hipocampo <i>post mortem<\/i> de vítimas de suicídio com <b>história de abuso na infância<\/b>.<\/li><\/ul>\n    <p class=\"key\">Ligação com a clínica: maior vulnerabilidade a ansiedade, depressão e anedonia em quem teve adversidade precoce, como <b>fator de risco<\/b>, não como destino.<\/p>\n    <p class=\"small muted\">📄 Weaver et al. (2004); McGowan, P. O. et al. (2009). <i>Nature Neuroscience<\/i>, 12, 342-348.<\/p>", "pq": "Explique o feedback negativo do eixo HPA como se fosse um termostato.", "chave": "GR no hipocampo freia o eixo HPA; a metilação do promotor do GR reduz esse freio."}, {"e": "🌱", "t": "BDNF, estresse e antidepressivos", "txt": "<ul><li>O <b>BDNF<\/b> (fator neurotrófico derivado do cérebro) sustenta a sobrevivência neuronal e a plasticidade sináptica.<\/li>\n    <li>O gene tem <b>vários promotores<\/b>; alguns respondem especialmente à atividade neuronal e ao estresse.<\/li>\n    <li><b>Tsankova et al. (2006)<\/b>: em camundongos submetidos a <b>derrota social crônica<\/b>, houve aumento duradouro de metilação repressiva de histonas (H3K27) em promotores do BDNF no hipocampo e redução da expressão.<\/li>\n    <li>O antidepressivo <b>imipramina<\/b> não removeu essa marca, mas aumentou a <b>acetilação<\/b> de histonas nesses promotores e restaurou a expressão do BDNF.<\/li><\/ul>\n    <p class=\"key\">Uma \"cicatriz molecular\" do estresse pode ser compensada por outras marcas: reversão funcional nem sempre é apagar a marca.<\/p>\n    <p class=\"small muted\">Nota: o slide cita H3K9me3 no promotor IV; o achado clássico de Tsankova et al. foi a dimetilação de H3K27.<\/p>\n    <p class=\"small muted\">📄 Tsankova, N. M. et al. (2006). <i>Nature Neuroscience<\/i>, 9, 519-525.<\/p>", "pq": "O que o estudo de Tsankova sugere sobre como um antidepressivo pode agir?", "chave": "Estresse crônico reprime o BDNF por marcas em histonas; antidepressivo aumenta a acetilação e restaura a expressão."}, {"e": "💾", "t": "Memória e HDAC2", "txt": "<ul><li>Consolidar uma memória de longo prazo exige <b>transcrição de genes<\/b> nos neurônios.<\/li>\n    <li><b>Guan et al. (2009)<\/b>: a enzima <b>HDAC2<\/b> funciona como um <b>freio<\/b> da formação de memórias e da plasticidade sináptica. Camundongos com excesso de HDAC2 aprenderam pior; sem HDAC2, aprenderam melhor.<\/li>\n    <li>Inibidores de HDAC melhoraram a memória e a plasticidade em <b>modelos animais<\/b>.<\/li><\/ul>\n    <p class=\"key\">Aprender também é um processo epigenético: abrir a cromatina facilita a expressão dos genes da memória.<\/p>\n    <p class=\"small muted\">🔗 Conecta com consolidação da memória (Psicologia Cognitiva). Os resultados de inibidores vêm de animais; não há tratamento estabelecido em humanos para memória.<\/p>\n    <p class=\"small muted\">📄 Guan, J.-S. et al. (2009). <i>Nature<\/i>, 459, 55-60.<\/p>", "pq": "Por que inibir uma HDAC poderia facilitar a consolidação de uma memória?", "chave": "HDAC2 restringe a formação de memórias; inibi-la favorece plasticidade (em animais)."}, {"e": "🤰", "t": "Gestação e janelas de plasticidade", "txt": "<ul><li>A placenta tem a enzima <b>11β-HSD2<\/b>, que inativa boa parte do cortisol materno. Estresse materno intenso pode <b>reduzir<\/b> essa barreira e expor mais o feto ao cortisol.<\/li>\n    <li><b>Oberlander et al. (2008)<\/b>: humor deprimido materno no 3º trimestre associou-se a <b>mais metilação<\/b> do gene do GR (<i>NR3C1<\/i>) no sangue do cordão e a maior reatividade ao estresse do bebê aos 3 meses.<\/li>\n    <li><b>Janelas sensíveis:<\/b>\n      <ul><li><b>Gestação<\/b>: alta plasticidade e vulnerabilidade a teratógenos e estresse.<\/li>\n      <li><b>Primeira infância<\/b>: programação dos sistemas de estresse e do vínculo.<\/li>\n      <li><b>Adolescência<\/b>: reorganização do córtex pré-frontal e das redes dopaminérgicas.<\/li><\/ul><\/li><\/ul>\n    <p class=\"key\">Janela sensível significa mais impacto do ambiente, para o bem e para o mal: também é quando a intervenção rende mais.<\/p>\n    <p class=\"small muted\">Nota: o slide fala em metilação de <i>FKBP5<\/i> no tecido cerebral fetal; em humanos, os dados mais sólidos vêm de amostras periféricas, como sangue do cordão e placenta.<\/p>\n    <p class=\"small muted\">📄 Oberlander, T. F. et al. (2008). <i>Epigenetics<\/i>, 3(2), 97-106.<\/p>", "pq": "Por que políticas de cuidado na gestação e na primeira infância têm forte justificativa biológica?", "chave": "Gestação, primeira infância e adolescência são janelas de maior plasticidade epigenética."}, {"e": "👨‍👩‍👧", "t": "Transmissão intergeracional: o que se sabe", "txt": "<div class=\"scroll\"><table class=\"tb\"><tr><th>Evidência<\/th><th>Força<\/th><\/tr>\n    <tr><td><b>Gapp et al. (2014)<\/b>: camundongos machos submetidos a estresse precoce tinham <b>microRNAs alterados no esperma<\/b>; injetar esses RNAs em embriões reproduziu alterações de comportamento e metabolismo na prole<\/td><td>Forte, mas <b>em animais<\/b><\/td><\/tr>\n    <tr><td><b>Yehuda et al. (2016)<\/b>: sobreviventes do Holocausto e seus filhos tinham diferenças de metilação no gene <i>FKBP5<\/i><\/td><td><b>Preliminar<\/b>: amostra pequena (32 sobreviventes e 22 filhos), muito debatida<\/td><\/tr>\n    <tr><td><b>Fome holandesa<\/b> (Heijmans et al., 2008): exposição pré-natal à fome associada a diferenças de metilação décadas depois<\/td><td>Efeito da exposição <b>intrauterina<\/b>, não herança pelo gameta<\/td><\/tr><\/table><\/div>\n    <p class=\"key\">Em humanos, é muito difícil separar herança epigenética, ambiente compartilhado, cuidado parental e cultura. A cautela já estava no módulo 4: em animais está demonstrado; em humanos, segue em debate.<\/p>\n    <p class=\"small muted\">📄 Gapp, K. et al. (2014). <i>Nature Neuroscience<\/i>, 17, 667-669; Yehuda, R. et al. (2016). <i>Biological Psychiatry<\/i>, 80, 372-380; Heijmans, B. T. et al. (2008). <i>PNAS<\/i>, 105, 17046-17049.<\/p>", "pq": "Por que o estudo com filhos de sobreviventes não prova, sozinho, herança epigenética?", "chave": "Transmissão por gametas: demonstrada em animais; em humanos, evidência preliminar e debatida."}, {"e": "🧩", "t": "Interação gene × ambiente: TEPT e FKBP5", "txt": "<ul><li><b>FKBP5<\/b> regula a sensibilidade do receptor de glicocorticoide: mais FKBP5 → GR menos sensível → freio do estresse mais fraco.<\/li>\n    <li><b>Klengel et al. (2013)<\/b>: em portadores de um <b>alelo de risco<\/b> do <i>FKBP5<\/i>, o <b>trauma na infância<\/b> levou à <b>desmetilação<\/b> de uma região do gene (íntron 7), aumentando sua expressão e o risco de TEPT na vida adulta. Trauma só na vida adulta não produziu o efeito.<\/li>\n    <li>É um exemplo molecular de <b>interação gene × ambiente (G×E)<\/b>: o genótipo muda a <b>suscetibilidade<\/b> do DNA à marca deixada pelo ambiente.<\/li><\/ul>\n    <p class=\"key\">O genótipo sozinho não prevê o desfecho; o ambiente sozinho também não. O que importa é a combinação, em determinado momento do desenvolvimento.<\/p>\n    <p class=\"small muted\">Cautela: estudos de G×E com genes candidatos (como o 5-HTTLPR, Caspi et al., 2003) muitas vezes não se replicaram em grandes amostras (Border et al., 2019). Achados isolados precisam de replicação.<\/p>\n    <p class=\"small muted\">📄 Klengel, T. et al. (2013). <i>Nature Neuroscience<\/i>, 16, 33-41; Border, R. et al. (2019). <i>American Journal of Psychiatry<\/i>, 176, 376-387.<\/p>", "pq": "Por que o efeito de Klengel aparece com trauma na infância e não com trauma na vida adulta?", "chave": "Alelo de risco do FKBP5 + trauma infantil → desmetilação → mais FKBP5 → maior risco de TEPT."}, {"e": "🩺", "t": "Epigenética e transtornos mentais", "txt": "<div class=\"scroll\"><table class=\"tb\"><tr><th>Quadro<\/th><th>Achados estudados<\/th><th>Nível de evidência<\/th><\/tr>\n    <tr><td>😔 <b>Depressão<\/b><\/td><td>Metilação do transportador de serotonina (<i>SLC6A4<\/i>) associada a trauma infantil e gravidade; menor expressão de BDNF e TrkB no córtex pré-frontal <i>post mortem<\/i><\/td><td>Associações; resultados heterogêneos<\/td><\/tr>\n    <tr><td>🌀 <b>Esquizofrenia<\/b><\/td><td>Redução de <b>reelina<\/b> (<i>RELN<\/i>) e de <b>GAD67<\/b> em interneurônios GABAérgicos; hipóteses de metilação e de repressão por HDAC<\/td><td>Redução de expressão é consistente; o papel da metilação é debatido<\/td><\/tr>\n    <tr><td>🎰 <b>Dependência química<\/b><\/td><td>Acúmulo do fator <b>ΔFosB<\/b> no núcleo accumbens, que recruta enzimas de remodelação da cromatina e mantém alterações duradouras ligadas à recaída<\/td><td>Forte em modelos animais<\/td><\/tr>\n    <tr><td>⚡ <b>TEPT<\/b><\/td><td><i>FKBP5<\/i> (Klengel, 2013) e metilação de genes do sistema imune (Uddin et al., 2010)<\/td><td>Promissor; precisa de replicação<\/td><\/tr><\/table><\/div>\n    <p class=\"key\">Na maioria dos transtornos humanos, o que existe são <b>associações<\/b>: ainda não se sabe se a marca causa o quadro ou é consequência dele.<\/p>\n    <p class=\"small muted\">📄 Nestler et al. (2016); Guidotti, A. et al. (2000). <i>Archives of General Psychiatry<\/i>, 57, 1061-1069; Nestler, E. J. (2008). <i>Phil. Trans. R. Soc. B<\/i>, 363, 3245-3255; Uddin, M. et al. (2010). <i>PNAS<\/i>, 107, 9470-9475.<\/p>", "pq": "Qual a diferença entre \"associado a\" e \"causa de\" quando falamos de marcas epigenéticas?", "chave": "Há associações epigenéticas em depressão, esquizofrenia, dependência e TEPT; causalidade em humanos ainda não está provada."}, {"e": "💬", "t": "Psicoterapia, fármacos e estilo de vida", "txt": "<p><b>Psicoterapia<\/b> (estudos iniciais, amostras pequenas):<\/p>\n    <ul><li>Crianças com transtornos de ansiedade que responderam à <b>TCC<\/b> mostraram mudanças na metilação de <i>SLC6A4<\/i> (Roberts et al., 2014) e de <i>FKBP5<\/i> (Roberts et al., 2015).<\/li>\n    <li>Veteranos com TEPT: metilação do <i>NR3C1<\/i> antes do tratamento previu a resposta à <b>exposição prolongada<\/b> (Yehuda et al., 2013).<\/li><\/ul>\n    <p><b>Fármacos:<\/b><\/p>\n    <ul><li><b>Valproato<\/b> (estabilizador de humor e anticonvulsivante) inibe diretamente HDACs (Phiel et al., 2001).<\/li>\n    <li>Antidepressivos alteram marcas de histonas em promotores do BDNF em animais (Tsankova et al., 2006).<\/li>\n    <li>Antipsicóticos atípicos aumentaram a HDAC2 e reduziram a expressão do receptor <b>mGlu2<\/b> no córtex de camundongos (Kurita et al., 2012).<\/li><\/ul>\n    <p><b>Estilo de vida:<\/b> exercício aeróbico aumenta o BDNF e a neurogênese no hipocampo em animais; folato e B12 influenciam a disponibilidade de grupos metil (SAM).<\/p>\n    <p class=\"key\">A experiência terapêutica é também uma experiência biológica. Mas \"a terapia muda os genes\" é exagero: o que muda é a <b>regulação<\/b>, e as evidências em humanos ainda são iniciais.<\/p>\n    <p class=\"small muted\">Nota: no slide, \"ecrotranscrição\" é um erro de digitação; o sentido é favorecer a transcrição.<\/p>\n    <p class=\"small muted\">📄 Roberts, S. et al. (2014). <i>Translational Psychiatry<\/i>, 4, e444; Roberts, S. et al. (2015). <i>Depression and Anxiety<\/i>, 32, 861-870; Yehuda, R. et al. (2013). <i>Frontiers in Psychiatry<\/i>, 4, 118; Phiel, C. J. et al. (2001). <i>Journal of Biological Chemistry<\/i>, 276, 36734-36741; Kurita, M. et al. (2012). <i>Nature Neuroscience<\/i>, 15, 1245-1254.<\/p>", "pq": "Como você explicaria a um paciente que a psicoterapia tem efeitos biológicos, sem exagerar?", "chave": "TCC e outras terapias se associam a mudanças epigenéticas (dados iniciais); valproato é inibidor de HDAC."}, {"e": "⏳", "t": "Relógios epigenéticos, vínculo e resiliência", "txt": "<ul><li><b>Relógio de Horvath (2013)<\/b>: estima a <b>idade biológica<\/b> de tecidos a partir da metilação de centenas de sítios CpG. Quando passa da idade cronológica, fala-se em <b>aceleração epigenética<\/b>.<\/li>\n    <li>Estresse ao longo da vida associou-se a aceleração do relógio (Zannas et al., 2015); a aceleração se relaciona a pior saúde e, em alguns estudos, a declínio cognitivo.<\/li>\n    <li><b>Deriva epigenética<\/b>: perda gradual de precisão das marcas com a idade.<\/li>\n    <li><b>Oxitocina (<i>OXTR<\/i>)<\/b>: a metilação do gene do receptor de oxitocina foi associada a diferenças no processamento social e no apego. Estudos ainda pequenos.<\/li>\n    <li><b>Resiliência ativa<\/b>: não é ausência de mudança, e sim adaptação. Uchida et al. (2011) mostraram em camundongos que o estado epigenético do gene <b>GDNF<\/b> no estriado ventral influencia quem se adapta ao estresse e quem se torna vulnerável.<\/li><\/ul>\n    <p class=\"key\">Resiliência também tem biologia, e ela pode ser estimulada: suporte social e ambientes enriquecidos são candidatos a \"moduladores protetores\".<\/p>\n    <p class=\"small muted\">📄 Horvath, S. (2013). <i>Genome Biology<\/i>, 14, R115; Zannas, A. S. et al. (2015). <i>Genome Biology<\/i>, 16, 266; Uchida, S. et al. (2011). <i>Neuron<\/i>, 69, 359-372; Puglia, M. H. et al. (2015). <i>PNAS<\/i>, 112, 3308-3313.<\/p>", "pq": "O que significa uma pessoa ter \"idade epigenética\" maior que a cronológica?", "chave": "Relógios epigenéticos estimam a idade biológica; estresse pode acelerá-la; resiliência é adaptação ativa."}, {"e": "🔬", "t": "Métodos, biomarcadores e limitações", "txt": "<p><b>Ferramentas:<\/b><\/p>\n    <ul><li><b>EWAS<\/b> (<i>epigenome-wide association study<\/i>): mede a metilação em centenas de milhares de sítios CpG em grandes amostras.<\/li>\n    <li><b>ChIP-seq<\/b>: imunoprecipitação da cromatina seguida de sequenciamento; mostra onde estão marcas de histonas ou proteínas ligadas ao DNA.<\/li><\/ul>\n    <p><b>Biomarcadores periféricos<\/b> (sangue, saliva): promessa de prever resposta a tratamentos e monitorar a evolução. A correlação com o cérebro é <b>apenas parcial<\/b> e varia por região do genoma (Hannon et al., 2015). Ainda <b>não há uso clínico estabelecido<\/b>.<\/p>\n    <p><b>Limites:<\/b><\/p>\n    <ul><li><b>Especificidade tecidual<\/b>: o cérebro vivo é quase inacessível; usa-se tecido <i>post mortem<\/i> ou sangue.<\/li>\n    <li><b>Heterogeneidade celular<\/b>: neurônios e glia misturados confundem o sinal.<\/li>\n    <li><b>Causalidade × correlação<\/b>: a marca pode ser causa, consequência ou efeito de medicação, fumo, dieta.<\/li><\/ul>\n    <p class=\"small muted\">Nota: o slide traduz EWAS como \"Genome-Wide Epigenetic Studies\"; a sigla corresponde a <i>epigenome-wide association studies<\/i>.<\/p>\n    <p class=\"small muted\">📄 Hannon, E. et al. (2015). <i>Epigenetics<\/i>, 10, 1024-1032; Nestler et al. (2016).<\/p>", "pq": "Por que um exame de sangue epigenético ainda não serve para diagnosticar depressão?", "chave": "EWAS e ChIP-seq investigam marcas; biomarcadores ainda não têm uso clínico; limite central: causa × correlação."}, {"e": "⚖️", "t": "Ética, futuro e síntese", "txt": "<p><b>Questões éticas:<\/b><\/p>\n    <ul><li><b>Determinismo de novo tipo<\/b>: trocar \"está nos genes\" por \"está nas marcas\", estigmatizando pessoas pelo histórico de adversidade dos pais ou ancestrais.<\/li>\n    <li><b>Culpabilização parental<\/b>: sobretudo das mães, como se cada atitude \"marcasse\" os filhos. A adversidade é estrutural (pobreza, violência, racismo), não só individual.<\/li><\/ul>\n    <p><b>Perspectivas:<\/b><\/p>\n    <ul><li><b>Edição do epigenoma<\/b>: ferramentas como <b>CRISPR-dCas9<\/b> acopladas a enzimas permitem alterar a metilação de um gene específico em laboratório (Liu et al., 2016).<\/li>\n    <li><b>Intervenções personalizadas<\/b> a partir de perfis biológicos: ainda horizonte de pesquisa.<\/li>\n    <li><b>Políticas públicas<\/b>: proteger a infância contra trauma e pobreza é também prevenção biológica.<\/li><\/ul>\n    <p class=\"key\">A experiência molda a biologia, e a biologia fundamenta a experiência: a epigenética é uma ponte entre mente, comportamento e molécula, não uma nova forma de determinismo.<\/p>\n    <p class=\"small muted\">📄 Liu, X. S. et al. (2016). <i>Cell<\/i>, 167, 233-247; Meaney (2010).<\/p>", "pq": "Como evitar que a epigenética vire uma nova forma de culpar as mães?", "chave": "Evitar determinismo epigenético e culpabilização; a epigenética reforça a responsabilidade social pela infância."}, {"e": "📚", "t": "Referências deste módulo", "txt": "<ul class=\"small\">\n    <li>Border, R. et al. (2019). No support for historical candidate gene or candidate gene-by-interaction hypotheses for major depression. <i>American Journal of Psychiatry<\/i>, 176(5), 376-387.<\/li>\n    <li>Caspi, A. et al. (2003). Influence of life stress on depression: moderation by a polymorphism in the 5-HTT gene. <i>Science<\/i>, 301, 386-389.<\/li>\n    <li>Day, J. J.; Sweatt, J. D. (2010). DNA methylation and memory formation. <i>Nature Neuroscience<\/i>, 13, 1319-1323.<\/li>\n    <li>Gapp, K. et al. (2014). Implication of sperm RNAs in transgenerational inheritance of the effects of early trauma in mice. <i>Nature Neuroscience<\/i>, 17, 667-669.<\/li>\n    <li>Guan, J.-S. et al. (2009). HDAC2 negatively regulates memory formation and synaptic plasticity. <i>Nature<\/i>, 459, 55-60.<\/li>\n    <li>Guidotti, A. et al. (2000). Decrease in reelin and glutamic acid decarboxylase67 expression in schizophrenia and bipolar disorder. <i>Archives of General Psychiatry<\/i>, 57, 1061-1069.<\/li>\n    <li>Hannon, E. et al. (2015). Interindividual methylomic variation across blood, cortex, and cerebellum. <i>Epigenetics<\/i>, 10(11), 1024-1032.<\/li>\n    <li>Heijmans, B. T. et al. (2008). Persistent epigenetic differences associated with prenatal exposure to famine in humans. <i>PNAS<\/i>, 105, 17046-17049.<\/li>\n    <li>Horvath, S. (2013). DNA methylation age of human tissues and cell types. <i>Genome Biology<\/i>, 14, R115.<\/li>\n    <li>Klengel, T. et al. (2013). Allele-specific FKBP5 DNA demethylation mediates gene-chi : genetics and epigenetics. <i>Depression and Anxiety<\/i>, 32, 861-870.<\/li>\n    <li>Tsankova, N. M. et al. (2006). Sustained hippocampal chromatin regulation in a mouse model of depression and antidepressant action. <i>Nature Neuroscience<\/i>, 9, 519-525.<\/li>\n    <li>Tsankova, N. et al. (2007). Epigenetic regulation in psychiatric disorders. <i>Nature Reviews Neuroscience<\/i>, 8, 355-367.<\/li>\n    <li>Uchida, S. et al. (2011). Epigenetic status of Gdnf in the ventral striatum determines susceptibility and adaptation to daily stressful events. <i>Neuron<\/i>, 69, 359-372.<\/li>\n    <li>Uddin, M. et al. (2010). Epigenetic and immune function profiles associated with posttraumatic stress disorder. <i>PNAS<\/i>, 107, 9470-9475.<\/li>\n    <li>Weaver, I. C. G. et al. (2004). Epigenetic programming by maternal behavior. <i>Nature Neuroscience<\/i>, 7, 847-854.<\/li>\n    <li>Yehuda, R. et al. (2013). Epigenetic biomarkers as predictors and correlates of symptom improvement following psychotherapy in combat veterans with PTSD. <i>Frontiers in Psychiatry<\/i>, 4, 118.<\/li>\n    <li>Yehuda, R. et al. (2016). Holocaust exposure induced intergenerational effects on FKBP5 methylation. <i>Biological Psychiatry<\/i>, 80, 372-380.<\/li>\n    <li>Zannas, A. S. et al. (2015). Lifetime stress accelerates epigenetic aging in an urban, African American cohort. <i>Genome Biology<\/i>, 16, 266.<\/li><\/ul>\n    <p class=\"small muted\">Material de aula: \"Epigenética na Psicologia: mecanismos moleculares e psicopatologia\" (slides). Onde o slide trazia imprecisões, o texto do app segue os artigos originais e indica a correção.<\/p>", "pq": "Escolha um artigo desta lista e procure o resumo original: o que ele acrescenta ao que você estudou?", "chave": "Os estudos centrais: Weaver (2004), Tsankova (2006), Guan (2009), Klengel (2013), Gapp (2014), Horvath (2013)."}]}], "flashcards": [{"m": "m1", "f": "O que é genética?", "b": "Ciência que estuda a <b>transmissão hereditária<\/b> por meio dos genes, explicando semelhanças e diversidade."}, {"m": "m1", "f": "Gene", "b": "Segmento de DNA com instruções para produzir proteínas ou regular funções; ocupa um <b>locus<\/b>."}, {"m": "m1", "f": "Alelos", "b": "Versões diferentes do mesmo gene. Iguais = <b>homozigoto<\/b>; diferentes = <b>heterozigoto<\/b>."}, {"m": "m1", "f": "Quantos cromossomos têm os humanos?", "b": "<b>46<\/b>, em 23 pares: 22 de autossomos + 1 par sexual."}, {"m": "m1", "f": "Histonas", "b": "Proteínas associadas ao DNA que o <b>compactam<\/b> e regulam o acesso à informação."}, {"m": "m1", "f": "Meiose", "b": "Divisão que forma os gametas; inclui <b>recombinação<\/b>, gerando variabilidade."}, {"m": "m1", "f": "Genótipo × fenótipo", "b": "<b>Genótipo:<\/b> conjunto de genes (AA, Aa, aa).<br><b>Fenótipo:<\/b> características observáveis = genótipo + ambiente."}, {"m": "m1", "f": "Dominância × recessividade", "b": "Dominante se expressa em Aa; recessivo só se expressa em <b>homozigose (aa)<\/b>."}, {"m": "m1", "f": "1ª Lei de Mendel", "b": "<b>Segregação:<\/b> os dois alelos de um gene se separam na formação dos gametas."}, {"m": "m1", "f": "2ª Lei de Mendel", "b": "<b>Segregação independente:<\/b> alelos de genes diferentes se distribuem independentemente."}, {"m": "m1", "f": "Aa × Aa: proporções", "b": "25% AA, 50% Aa, 25% aa. Fenótipos: <b>3:1<\/b>. Chance de filho afetado (recessivo): <b>25%<\/b>."}, {"m": "m1", "f": "Probabilidade em cada gestação", "b": "Cada gestação é <b>independente<\/b>: as chances se repetem, não importa o que aconteceu antes."}, {"m": "m1", "f": "Dogma Central", "b": "<b>DNA → RNA → proteína<\/b>."}, {"m": "m2", "f": "Princípio transformante", "b": "Descoberto por <b>Griffith (1928)<\/b>; identificado como DNA por <b>Avery, MacLeod e McCarty (1944)<\/b>."}, {"m": "m2", "f": "Watson e Crick (1953)", "b": "Propuseram o modelo da <b>dupla hélice<\/b> do DNA, com dados de difração de raios X (Rosalind Franklin)."}, {"m": "m2", "f": "Componentes do nucleotídeo de DNA", "b": "Fosfato + <b>desoxirribose<\/b> + base nitrogenada (A, T, C ou G)."}, {"m": "m2", "f": "Pareamento de bases", "b": "<b>A–T<\/b> (2 pontes de hidrogênio) e <b>C–G<\/b> (3 pontes)."}, {"m": "m2", "f": "Purinas e pirimidinas", "b": "<b>Purinas:<\/b> A e G. <b>Pirimidinas:<\/b> C, T (e U no RNA)."}, {"m": "m2", "f": "Nucleossomo", "b": "Unidade de DNA enrolado em <b>histonas<\/b>; base da compactação da cromatina."}, {"m": "m2", "f": "Replicação semiconservativa", "b": "Cada nova molécula de DNA mantém <b>uma fita antiga e uma nova<\/b>."}, {"m": "m2", "f": "DNA polimerase", "b": "Principal enzima da replicação; sintetiza no sentido <b>5'→3'<\/b>."}, {"m": "m2", "f": "Fragmentos de Okazaki", "b": "Pedaços da fita sintetizada de forma <b>descontínua<\/b>, depois unidos pela ligase."}, {"m": "m2", "f": "Telômeros e telomerase", "b": "Pontas dos cromossomos que <b>encurtam<\/b> a cada replicação; a <b>telomerase<\/b> as recompõe."}, {"m": "m2", "f": "Diferenças entre RNA e DNA", "b": "RNA: <b>ribose<\/b>, <b>uracila<\/b> (U no lugar de T) e geralmente fita simples."}, {"m": "m2", "f": "Transcrição", "b": "Síntese de RNA a partir do DNA pela <b>RNA polimerase<\/b>, iniciando no <b>promotor<\/b>."}, {"m": "m2", "f": "Splicing", "b": "Remoção dos <b>íntrons<\/b> e união dos <b>éxons<\/b> no RNA de eucariotos."}, {"m": "m2", "f": "mRNA, rRNA e tRNA", "b": "<b>mRNA:<\/b> leva a mensagem. <b>rRNA:<\/b> forma o ribossomo. <b>tRNA:<\/b> transporta aminoácidos (anticódon)."}, {"m": "m2", "f": "Códon", "b": "Trinca de nucleotídeos que codifica um aminoácido; 64 códons para 20 aminoácidos."}, {"m": "m2", "f": "Códon de início e de parada", "b": "Início: <b>AUG<\/b> (metionina). Parada: <b>UAA, UAG, UGA<\/b>."}, {"m": "m2", "f": "Características do código genético", "b": "<b>Redundante<\/b> (degenerado) e praticamente <b>universal<\/b>."}, {"m": "m2", "f": "Tradução", "b": "Leitura do mRNA no <b>ribossomo<\/b> para formar a cadeia de aminoácidos."}, {"m": "m2", "f": "Aneuploidia × euploidia", "b": "<b>Aneuploidia:<\/b> cromossomo a mais ou a menos (ex.: trissomia do 21).<br><b>Euploidia:<\/b> alteração de conjuntos inteiros."}, {"m": "m2", "f": "Mutação germinativa × somática", "b": "<b>Germinativa:<\/b> passa aos descendentes.<br><b>Somática:<\/b> fica no indivíduo (câncer)."}, {"m": "m2", "f": "Mecanismos de reparo do DNA", "b": "Fotorreativação, excisão de bases, excisão de nucleotídeos, recombinação. Se falham: <b>apoptose<\/b>."}, {"m": "m2", "f": "Transposons", "b": "\"Genes saltadores\" que mudam de lugar no genoma; propostos por <b>Barbara McClintock<\/b>."}, {"m": "m3", "f": "Lobo frontal", "b": "<b>Funções executivas<\/b>: planejamento, decisão, controle emocional, atenção, julgamento, personalidade."}, {"m": "m3", "f": "Lobo parietal", "b": "Informações <b>sensoriais e espaciais<\/b>: toque, dor, temperatura, orientação."}, {"m": "m3", "f": "Lobo temporal", "b": "<b>Audição<\/b>, memória e linguagem."}, {"m": "m3", "f": "Lobo occipital", "b": "<b>Visão<\/b>: objetos, rostos, cores, profundidade e movimento."}, {"m": "m3", "f": "Amígdala", "b": "Processa reações emocionais: <b>medo<\/b>, ansiedade, agressividade, valência emocional."}, {"m": "m3", "f": "Hipocampo", "b": "Formação de <b>novas memórias<\/b> e navegação espacial."}, {"m": "m3", "f": "Hipotálamo", "b": "Temperatura, fome, sede, sono e hormônios; elo entre sistema <b>nervoso e endócrino<\/b>."}, {"m": "m3", "f": "Dopamina", "b": "<b>Motivação, recompensa e movimento<\/b>. Ligada a TDAH, Parkinson e esquizofrenia."}, {"m": "m3", "f": "Serotonina", "b": "<b>Humor, sono<\/b> (precursora da melatonina), apetite e bem-estar."}, {"m": "m3", "f": "Cortisol", "b": "Hormônio do <b>estresse<\/b>, liberado pelo eixo HPA (hipotálamo-hipófise-adrenal)."}, {"m": "m3", "f": "Adrenalina", "b": "Reação de <b>luta ou fuga<\/b>: coração acelerado, pressão alta, alerta."}, {"m": "m3", "f": "Ocitocina", "b": "<b>Vínculo<\/b>: apego, empatia, confiança, relações afetivas e parentais."}, {"m": "m3", "f": "Plasticidade cerebral", "b": "Capacidade do cérebro de se <b>remodelar a vida toda<\/b> por aprendizado, experiências, terapia, reabilitação e hábitos."}, {"m": "m4", "f": "Herdabilidade", "b": "Proporção da <b>variação<\/b> de um traço, numa população e contexto, atribuída a diferenças genéticas. Não vale para indivíduos."}, {"m": "m4", "f": "Herdabilidade 0,70 significa...", "b": "Que 70% das <b>diferenças entre pessoas<\/b> daquela população se associam a diferenças genéticas. Não que 70% de cada pessoa seja genético."}, {"m": "m4", "f": "Gêmeos MZ × DZ", "b": "<b>MZ:<\/b> ~100% do DNA. <b>DZ:<\/b> ~50% das variantes. Mais concordância em MZ sugere influência genética."}, {"m": "m4", "f": "Por que gêmeos MZ diferem?", "b": "Diferenças <b>ambientais, epigenéticas, de desenvolvimento e estocásticas<\/b>."}, {"m": "m4", "f": "Agregação familiar", "b": "Não prova origem genética: famílias compartilham genes, <b>ambiente e cultura<\/b>."}, {"m": "m4", "f": "Poligenia", "b": "Traço influenciado por <b>muitos genes de pequeno efeito<\/b>."}, {"m": "m4", "f": "Associação genética", "b": "Indica <b>vulnerabilidade<\/b> ou influência, não determinação; não prevê o comportamento individual."}, {"m": "m4", "f": "Epigenética", "b": "Mudança na <b>expressão gênica sem alterar a sequência do DNA<\/b> (ex.: metilação)."}, {"m": "m4", "f": "Correlação gene-ambiente: 3 tipos", "b": "<b>Passiva<\/b> (pais dão genes e ambiente), <b>evocativa<\/b> (traços provocam respostas), <b>ativa<\/b> (busca de ambientes)."}, {"m": "m4", "f": "Analogia das sementes (Lewontin)", "b": "Diferenças <b>entre grupos<\/b> em ambientes desiguais podem ser totalmente ambientais, mesmo com alta herdabilidade dentro dos grupos."}, {"m": "m5", "f": "Herdabilidade: depressão maior", "b": "<b>30–40%<\/b>; grande peso ambiental (60–70%)."}, {"m": "m5", "f": "Herdabilidade: ansiedade", "b": "<b>25–35%<\/b>, variando por subtipo; temperamento ansioso e amígdala reativa."}, {"m":
